trigger: none
pr: none
parameters:
  - name: imageTag
    type: string
    default: $(Build.SourceVersion)

stages:
  - stage: Build
    jobs:
      - job: ValidateAndBuild
        pool: { vmImage: ubuntu-latest }
        steps:
          - checkout: self
          - script: dotnet build DatavancedBD.AspNetCore.SmartTaskManagementSystem.slnx
            displayName: Build backend
          - script: npm ci && npm run build:prod
            workingDirectory: Frontend/Angular
            displayName: Build frontend
  - stage: Release
    dependsOn: Build
    jobs:
      - deployment: DeployImmutableDigests
        environment: stms-production
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Publish the reviewed image digests and run the separate Admin release Job for tag ${{ parameters.imageTag }}."
                  displayName: Release contract

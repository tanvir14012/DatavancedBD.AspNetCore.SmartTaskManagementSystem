trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

variables:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

  azureLocation: 'southeastasia'
  resourceGroup: 'stms-prod-rg'
  vmName: 'stms-prod-vm'
  storageAccount: 'stmsprodartifacts'
  storageContainer: 'deployments'
  vmSize: 'Standard_D2_v3'
  vmFamily: 'standardDv3Family'
  vmVcpus: '2'

  efToolsVersion: '10.0.9'

stages:

- stage: Preflight
  displayName: Azure Quota Check
  jobs:
  - job: CheckQuota
    pool:
      vmImage: 'windows-latest'
    steps:
    - checkout: none

    - task: AzureCLI@2
      displayName: Check $(vmSize) Quota
      condition: ne(variables['Build.Reason'], 'PullRequest')
      inputs:
        azureSubscription: 'STMS-Azure-Service-Connection'
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'

          $usage = (az vm list-usage `
            --location "$(azureLocation)" `
            --output json `
            --only-show-errors | Out-String) | ConvertFrom-Json

          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to read Azure VM quota.'
          }

          $family = $usage |
            Where-Object { $_.name.value -eq "$(vmFamily)" } |
            Select-Object -First 1

          $regional = $usage |
            Where-Object { $_.name.value -eq 'cores' } |
            Select-Object -First 1

          if (-not $family -or -not $regional) {
            throw 'Azure did not return the expected VM quota records.'
          }

          $required = [int]"$(vmVcpus)"
          $familyRemaining = [int]$family.limit - [int]$family.currentValue
          $regionalRemaining = [int]$regional.limit - [int]$regional.currentValue

          Write-Host "$(vmSize): familyRemaining=$familyRemaining, regionalRemaining=$regionalRemaining, required=$required"

          if ($familyRemaining -lt $required -or $regionalRemaining -lt $required) {
            throw 'Insufficient Azure vCPU quota for $(vmSize).'
          }

          Write-Host 'VM quota check passed.'

- stage: Build
  displayName: Build and Test
  dependsOn: Preflight
  condition: in(dependencies.Preflight.result, 'Succeeded', 'SucceededWithIssues')

  jobs:

  - job: Backend
    displayName: Build Test Publish Backend
    pool:
      vmImage: 'windows-latest'

    steps:
    - checkout: self
      clean: true

    - task: UseDotNet@2
      displayName: Install .NET 10 SDK
      inputs:
        packageType: sdk
        version: '10.0.x'

    - task: PowerShell@2
      displayName: Restore Build Test
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'

          Set-Location "$(Build.SourcesDirectory)"

          & dotnet restore
          if ($LASTEXITCODE -ne 0) {
              throw 'dotnet restore failed.'
          }

          & dotnet build --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) {
              throw 'dotnet build failed.'
          }

          & dotnet test `
            "$(Build.SourcesDirectory)\Infrastructure.Tests\Infrastructure.Tests.csproj" `
            --configuration Release `
            --no-build `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
              throw 'dotnet test failed.'
          }

    - task: PowerShell@2
      displayName: Publish API
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'

          $publishDirectory = "$(Build.ArtifactStagingDirectory)\api"
          Remove-Item -LiteralPath $publishDirectory -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $publishDirectory | Out-Null

          & dotnet publish `
            "$(Build.SourcesDirectory)\Api\Api.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output $publishDirectory

          if ($LASTEXITCODE -ne 0) {
              throw 'API publish failed.'
          }

          if (-not (Test-Path -LiteralPath "$publishDirectory\Api.exe")) {
              throw "Self-contained API executable was not produced: $publishDirectory\Api.exe"
          }

          if (-not (Test-Path -LiteralPath "$publishDirectory\web.config")) {
              throw "IIS web.config was not produced by dotnet publish."
          }

    - task: PowerShell@2
      displayName: Create EF Migration Bundle
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'

          Set-Location "$(Build.SourcesDirectory)"

          $toolPath = "$(Agent.TempDirectory)\ef-tools"
          $efTool = "$toolPath\dotnet-ef.exe"
          $bundleDirectory = "$(Build.ArtifactStagingDirectory)\efbundle"
          $bundleOutput = "$bundleDirectory\stms-migrate.exe"
          $apiPublishDirectory = "$(Build.ArtifactStagingDirectory)\api"

          Remove-Item -LiteralPath $toolPath -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $bundleDirectory -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path $toolPath,$bundleDirectory | Out-Null

          & dotnet tool install `
            --tool-path $toolPath `
            dotnet-ef `
            --version "$(efToolsVersion)"

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet-ef $(efToolsVersion) installation failed."
          }

          if (-not (Test-Path -LiteralPath $efTool)) {
              throw "dotnet-ef executable not found at $efTool"
          }

          $env:ASPNETCORE_ENVIRONMENT = 'Production'
          $env:DOTNET_ENVIRONMENT = 'Production'

          & $efTool migrations bundle `
            --project "$(Build.SourcesDirectory)\Infrastructure\Infrastructure.csproj" `
            --startup-project "$(Build.SourcesDirectory)\Api\Api.csproj" `
            --configuration Release `
            --target-runtime win-x64 `
            --self-contained `
            --output $bundleOutput `
            --force `
            --verbose

          if ($LASTEXITCODE -ne 0) {
              throw 'EF Core migration bundle generation failed.'
          }

          if (-not (Test-Path -LiteralPath $bundleOutput)) {
              throw "Migration bundle was not created: $bundleOutput"
          }

          Copy-Item -LiteralPath $bundleOutput -Destination "$apiPublishDirectory\stms-migrate.exe" -Force

          if (-not (Test-Path -LiteralPath "$apiPublishDirectory\stms-migrate.exe")) {
              throw 'Migration bundle was not copied into the API deployment package.'
          }

          $bundle = Get-Item -LiteralPath "$apiPublishDirectory\stms-migrate.exe"
          Write-Host "EF bundle ready: $($bundle.FullName) ($([Math]::Round($bundle.Length / 1MB, 2)) MB)"

    - task: ArchiveFiles@2
      displayName: Package Backend
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)\api'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)\backend.zip'
        replaceExistingArchive: true

    - publish: '$(Build.ArtifactStagingDirectory)\backend.zip'
      artifact: backend

  - job: Frontend
    displayName: Build Angular Frontend
    pool:
      vmImage: 'windows-latest'

    steps:
    - checkout: self
      clean: true

    - task: NodeTool@0
      displayName: Install Node 22
      inputs:
        versionSpec: '22.x'

    - task: PowerShell@2
      displayName: Verify Production API Base URL
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'

          $file = "$(Build.SourcesDirectory)\Frontend\Angular\src\environments\environment.prod.ts"

          if (-not (Test-Path -LiteralPath $file)) {
              throw "Angular production environment file not found: $file"
          }

          $content = Get-Content -LiteralPath $file -Raw

          if ($content -notmatch "apiBaseUrl\s*:\s*'/services/api'") {
              throw "environment.prod.ts must use apiBaseUrl: '/services/api'"
          }

    - task: PowerShell@2
      displayName: Build Angular
      inputs:
        pwsh: true
        targetType: inline
        workingDirectory: '$(Build.SourcesDirectory)\Frontend\Angular'
        script: |
          $ErrorActionPreference = 'Stop'

          & npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {
              throw 'npm ci failed.'
          }

          & npm run build:prod
          if ($LASTEXITCODE -ne 0) {
              throw 'Angular production build failed.'
          }

    - task: PowerShell@2
      displayName: Create IIS web.config
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'

          $frontend = "$(Build.SourcesDirectory)\Frontend\Angular\dist\smart-task-management-system\browser"

          if (-not (Test-Path -LiteralPath "$frontend\index.html")) {
              throw 'Angular index.html is missing from the production build.'
          }

          $webConfig = @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>

              <rewrite>
                <rules>

                  <rule name="Angular Routes" stopProcessing="true">
                    <match url=".*" />

                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                      <add input="{REQUEST_URI}" pattern="^/services" negate="true" />
                      <add input="{REQUEST_URI}" pattern="^/api" negate="true" />
                    </conditions>

                    <action type="Rewrite" url="/index.html" />
                  </rule>

                </rules>
              </rewrite>

              <staticContent>
                <remove fileExtension=".json" />
                <mimeMap fileExtension=".json" mimeType="application/json" />
              </staticContent>

            </system.webServer>
          </configuration>
          '@

          Set-Content -LiteralPath "$frontend\web.config" -Value $webConfig -Encoding utf8

          [xml](Get-Content -LiteralPath "$frontend\web.config" -Raw) | Out-Null

    - task: ArchiveFiles@2
      displayName: Package Angular
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)\Frontend\Angular\dist\smart-task-management-system\browser'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)\frontend.zip'
        replaceExistingArchive: true

    - publish: '$(Build.ArtifactStagingDirectory)\frontend.zip'
      artifact: frontend

- stage: Deploy
  displayName: Deploy Production
  dependsOn:
    - Build

  condition: |
    and(
      succeeded(),
      ne(variables['Build.Reason'], 'PullRequest')
    )

  jobs:
  - deployment: DeployProduction
    displayName: Deploy STMS Production
    environment: Production

    pool:
      vmImage: 'windows-latest'

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            clean: true

          - download: current
            artifact: backend

          - download: current
            artifact: frontend

          - task: AzureCLI@2
            displayName: Deploy Azure Infrastructure
            env:
              VM_ADMIN_PASSWORD: $(VM_ADMIN_PASSWORD)
            inputs:
              azureSubscription: 'STMS-Azure-Service-Connection'
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'

                $root = "$(Build.SourcesDirectory)\Azure\infra\prod"
                $parametersPath = Join-Path $root 'parameters\vm-windows-prod.json'
                $paramFile = '@' + $parametersPath

                az deployment sub create `
                  --name stms-prod-rg-deployment `
                  --location "$(azureLocation)" `
                  --template-file "$root\rg.bicep" `
                  --parameters location="$(azureLocation)" resourceGroupName="$(resourceGroup)" `
                  --only-show-errors `
                  --output none

                if ($LASTEXITCODE -ne 0) { throw 'Resource group deployment failed.' }

                az deployment group create `
                  --name stms-prod-storage-deployment `
                  --resource-group "$(resourceGroup)" `
                  --template-file "$root\storage.bicep" `
                  --parameters location="$(azureLocation)" storageAccountName="$(storageAccount)" containerName="$(storageContainer)" `
                  --only-show-errors `
                  --output none

                if ($LASTEXITCODE -ne 0) { throw 'Storage deployment failed.' }

                Write-Host "Deploying $(vmSize)..."

                $result = az deployment group create `
                  --name stms-prod-vm-deployment `
                  --resource-group "$(resourceGroup)" `
                  --template-file "$root\vm-windows.bicep" `
                  --parameters $paramFile adminPassword="$env:VM_ADMIN_PASSWORD" vmSize="$(vmSize)" `
                  --only-show-errors `
                  --output none 2>&1

                if ($LASTEXITCODE -ne 0) {
                  Write-Host ($result | Out-String)
                  throw 'VM deployment failed.'
                }

                $pipName = az deployment group show `
                  --resource-group "$(resourceGroup)" `
                  --name stms-prod-vm-deployment `
                  --query properties.outputs.publicIpName.value `
                  --output tsv

                $vmIp = az network public-ip show `
                  --resource-group "$(resourceGroup)" `
                  --name $pipName `
                  --query ipAddress `
                  --output tsv

                if ([string]::IsNullOrWhiteSpace($vmIp)) {
                  throw 'Could not resolve VM public IP.'
                }

                Write-Host "VM: $(vmSize)"
                Write-Host "IP: $vmIp"
                Write-Host "##vso[task.setvariable variable=VM_PUBLIC_IP]$vmIp"

          - task: AzureCLI@2
            displayName: Upload Deployment Packages
            inputs:
              azureSubscription: 'STMS-Azure-Service-Connection'
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'

                $backend = "$(Pipeline.Workspace)\backend\backend.zip"
                $frontend = "$(Pipeline.Workspace)\frontend\frontend.zip"

                foreach ($artifact in @($backend, $frontend)) {
                    if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
                        throw "Pipeline artifact not found: $artifact"
                    }

                    if ((Get-Item -LiteralPath $artifact).Length -eq 0) {
                        throw "Pipeline artifact is empty: $artifact"
                    }
                }

                $storageKey = & az storage account keys list `
                  --account-name "$(storageAccount)" `
                  --resource-group "$(resourceGroup)" `
                  --query '[0].value' `
                  --output tsv `
                  --only-show-errors

                if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($storageKey)) {
                    throw 'Unable to obtain the deployment storage account key.'
                }

                Write-Host "##vso[task.setsecret]$storageKey"

                $backendBlob = "backend-$(Build.BuildId).zip"
                $frontendBlob = "frontend-$(Build.BuildId).zip"

                & az storage blob upload `
                  --account-name "$(storageAccount)" `
                  --account-key $storageKey `
                  --container-name "$(storageContainer)" `
                  --name $backendBlob `
                  --file $backend `
                  --overwrite true `
                  --only-show-errors `
                  --output none

                if ($LASTEXITCODE -ne 0) {
                    throw 'Backend package upload failed.'
                }

                & az storage blob upload `
                  --account-name "$(storageAccount)" `
                  --account-key $storageKey `
                  --container-name "$(storageContainer)" `
                  --name $frontendBlob `
                  --file $frontend `
                  --overwrite true `
                  --only-show-errors `
                  --output none

                if ($LASTEXITCODE -ne 0) {
                    throw 'Frontend package upload failed.'
                }

                $expiry = (Get-Date).ToUniversalTime().AddHours(2).ToString('yyyy-MM-ddTHH:mm:ssZ')

                $backendSas = & az storage blob generate-sas `
                  --account-name "$(storageAccount)" `
                  --account-key $storageKey `
                  --container-name "$(storageContainer)" `
                  --name $backendBlob `
                  --permissions r `
                  --https-only `
                  --expiry $expiry `
                  --output tsv `
                  --only-show-errors

                if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($backendSas)) {
                    throw 'Backend SAS generation failed.'
                }

                $frontendSas = & az storage blob generate-sas `
                  --account-name "$(storageAccount)" `
                  --account-key $storageKey `
                  --container-name "$(storageContainer)" `
                  --name $frontendBlob `
                  --permissions r `
                  --https-only `
                  --expiry $expiry `
                  --output tsv `
                  --only-show-errors

                if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($frontendSas)) {
                    throw 'Frontend SAS generation failed.'
                }

                $backendUrl = "https://$(storageAccount).blob.core.windows.net/$(storageContainer)/$backendBlob?$backendSas"
                $frontendUrl = "https://$(storageAccount).blob.core.windows.net/$(storageContainer)/$frontendBlob?$frontendSas"

                Write-Host "##vso[task.setsecret]$backendUrl"
                Write-Host "##vso[task.setsecret]$frontendUrl"

                Write-Host "##vso[task.setvariable variable=BACKEND_PACKAGE_URL;issecret=true]$backendUrl"
                Write-Host "##vso[task.setvariable variable=FRONTEND_PACKAGE_URL;issecret=true]$frontendUrl"

          - task: AzureCLI@2
            displayName: Configure Windows VM in Phases
            env:
              SQL_SA_PASSWORD: $(SQL_SA_PASSWORD)
              JWT_KEY: $(JWT_KEY)
              GROQ_API_KEY: $(GROQ_API_KEY)
              BACKEND_PACKAGE_URL: $(BACKEND_PACKAGE_URL)
              FRONTEND_PACKAGE_URL: $(FRONTEND_PACKAGE_URL)
            inputs:
              azureSubscription: 'STMS-Azure-Service-Connection'
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'

                function Encode([string]$value) {
                  [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($value))
                }

                function Invoke-RemotePhase {
                  param(
                    [Parameter(Mandatory = $true)][string]$Name,
                    [Parameter(Mandatory = $true)][string]$Script,
                    [switch]$AllowReboot
                  )

                  for ($attempt = 1; $attempt -le 2; $attempt++) {
                    Write-Host ""
                    Write-Host "========== $Name (attempt $attempt) =========="

                    $path = Join-Path "$(Agent.TempDirectory)" ("stms-" + ($Name -replace '[^A-Za-z0-9-]', '-') + ".ps1")
                    Set-Content -LiteralPath $path -Value $Script -Encoding utf8

                    $tokens = $null
                    $errors = $null
                    [System.Management.Automation.Language.Parser]::ParseInput(
                      $Script,
                      [ref]$tokens,
                      [ref]$errors
                    ) | Out-Null

                    if ($errors.Count -gt 0) {
                      throw "$Name script parse failure: $(($errors.Message) -join '; ')"
                    }

                    $scriptArg = '@' + $path

                    $raw = az vm run-command invoke `
                      --resource-group "$(resourceGroup)" `
                      --name "$(vmName)" `
                      --command-id RunPowerShellScript `
                      --scripts $scriptArg `
                      --only-show-errors `
                      --output json

                    if ($LASTEXITCODE -ne 0) {
                      throw "$Name Azure Run Command invocation failed."
                    }

                    $result = ($raw | Out-String) | ConvertFrom-Json

                    $stdout = @(
                      $result.value |
                      Where-Object { $_.code -like 'ComponentStatus/StdOut/*' } |
                      ForEach-Object { $_.message }
                    ) -join "`n"

                    $stderr = @(
                      $result.value |
                      Where-Object { $_.code -like 'ComponentStatus/StdErr/*' } |
                      ForEach-Object { $_.message }
                    ) -join "`n"

                    if ($stdout) { Write-Host $stdout }
                    if ($stderr) { Write-Warning $stderr }

                    if ($stdout -match 'STMS_PHASE_OK') {
                      Write-Host "========== $Name complete =========="
                      return
                    }

                    if ($AllowReboot -and $stdout -match 'STMS_REBOOT_REQUIRED' -and $attempt -eq 1) {
                      Write-Host "$Name requested a reboot. Restarting VM..."

                      az vm restart `
                        --resource-group "$(resourceGroup)" `
                        --name "$(vmName)" `
                        --only-show-errors `
                        --output none

                      if ($LASTEXITCODE -ne 0) {
                        throw 'Azure VM restart failed.'
                      }

                      Start-Sleep -Seconds 30
                      continue
                    }

                    throw "$Name failed. $stderr"
                  }

                  throw "$Name did not complete after reboot retry."
                }

                foreach ($required in @(
                  'SQL_SA_PASSWORD',
                  'JWT_KEY',
                  'GROQ_API_KEY',
                  'BACKEND_PACKAGE_URL',
                  'FRONTEND_PACKAGE_URL'
                )) {
                  if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($required))) {
                    throw "Required deployment variable is empty: $required"
                  }
                }

                $sql64 = Encode $env:SQL_SA_PASSWORD
                $backend64 = Encode $env:BACKEND_PACKAGE_URL
                $frontend64 = Encode $env:FRONTEND_PACKAGE_URL
                $jwt64 = Encode $env:JWT_KEY
                $groq64 = Encode $env:GROQ_API_KEY
                $ip64 = Encode "$(VM_PUBLIC_IP)"

                $prerequisites = @'
                $ErrorActionPreference = "Stop"
                $ProgressPreference = "SilentlyContinue"

                function Run-Installer {
                  param(
                    [string]$FilePath,
                    [string[]]$Arguments,
                    [int]$TimeoutSeconds,
                    [int[]]$SuccessCodes = @(0),
                    [string]$LogPath
                  )

                  Write-Host "Starting installer: $FilePath"

                  $p = Start-Process `
                    -FilePath $FilePath `
                    -ArgumentList $Arguments `
                    -PassThru `
                    -NoNewWindow

                  $completed = $p.WaitForExit($TimeoutSeconds * 1000)

                  if (-not $completed) {
                    & taskkill.exe /PID $p.Id /T /F | Out-Null
                    throw "Installer timed out after $TimeoutSeconds seconds: $FilePath"
                  }

                  # Ensure the native process handle is finalized before reading ExitCode.
                  $p.WaitForExit()
                  $p.Refresh()
                  $exitCode = [int]$p.ExitCode

                  Write-Host "Installer exit code: $exitCode ($FilePath)"

                  if ($SuccessCodes -notcontains $exitCode) {
                    $logDetails = ""

                    if ($LogPath -and (Test-Path -LiteralPath $LogPath)) {
                      $tail = Get-Content -LiteralPath $LogPath -Tail 80 -ErrorAction SilentlyContinue
                      if ($tail) {
                        $logDetails = "`n--- Installer log tail: $LogPath ---`n$($tail -join [Environment]::NewLine)"
                      }
                    }

                    throw "Installer failed with exit code ${exitCode}: $FilePath$logDetails"
                  }

                  return $exitCode
                }

                try {
                  Write-Host "Installing IIS..."
                  $featureResult = Install-WindowsFeature `
                    Web-Server, `
                    Web-Static-Content, `
                    Web-Default-Doc, `
                    Web-Http-Errors, `
                    Web-Http-Logging, `
                    Web-Filtering, `
                    Web-Stat-Compression, `
                    Web-Mgmt-Console, `
                    Web-WebSockets `
                    -IncludeManagementTools

                  if (-not $featureResult.Success) {
                    throw "IIS installation failed."
                  }

                  if ($featureResult.RestartNeeded -eq "Yes") {
                    Write-Host "STMS_REBOOT_REQUIRED"
                    exit 0
                  }

                  $root = "C:\stms-prod-install"
                  New-Item -ItemType Directory -Force -Path $root | Out-Null

                  $rewriteDll = "C:\Windows\System32\inetsrv\rewrite.dll"
                  if (-not (Test-Path -LiteralPath $rewriteDll)) {
                    Write-Host "Installing IIS URL Rewrite..."
                    $msi = "$root\rewrite.msi"
                    $rewriteUrl = "https://download.microsoft.com/download/1/2/8/128E2E22-C1B9-44A4-BE2A-5859ED1D4592/rewrite_amd64_en-US.msi"
                    $downloaded = $false

                    for ($attempt = 1; $attempt -le 3 -and -not $downloaded; $attempt++) {
                      try {
                        Write-Host "Downloading IIS URL Rewrite (attempt $attempt of 3)..."
                        Invoke-WebRequest `
                          -UseBasicParsing `
                          -Uri $rewriteUrl `
                          -OutFile $msi `
                          -TimeoutSec 300

                        if (-not (Test-Path -LiteralPath $msi) -or (Get-Item $msi).Length -lt 1MB) {
                          throw "Downloaded URL Rewrite MSI is missing or unexpectedly small."
                        }

                        $downloaded = $true
                      }
                      catch {
                        if ($attempt -ge 3) { throw }
                        Start-Sleep -Seconds 5
                      }
                    }

                    $signature = Get-AuthenticodeSignature -FilePath $msi

                    if ($signature.Status -ne "Valid" -or
                        $signature.SignerCertificate.Subject -notmatch "Microsoft") {
                      throw "URL Rewrite MSI does not have a valid Microsoft signature. Status: $($signature.Status)"
                    }

                    $rewriteLog = "$root\rewrite-install.log"

                    $code = Run-Installer `
                      -FilePath "msiexec.exe" `
                      -Arguments @(
                        "/i",
                        "`"$msi`"",
                        "/qn",
                        "/norestart",
                        "/L*v",
                        "`"$rewriteLog`""
                      ) `
                      -TimeoutSeconds 300 `
                      -SuccessCodes @(0, 3010) `
                      -LogPath $rewriteLog

                    if ($code -eq 3010) {
                      Write-Host "STMS_REBOOT_REQUIRED"
                      exit 0
                    }
                  }

                  $ancm = "C:\Program Files\IIS\Asp.Net Core Module\V2\aspnetcorev2.dll"
                  if (-not (Test-Path -LiteralPath $ancm)) {
                    Write-Host "Installing .NET 10 Hosting Bundle..."
                    $hosting = "$root\dotnet-hosting.exe"

                    Invoke-WebRequest `
                      -UseBasicParsing `
                      -Uri "https://aka.ms/dotnet/10.0/dotnet-hosting-win.exe" `
                      -OutFile $hosting `
                      -TimeoutSec 600

                    $code = Run-Installer `
                      -FilePath $hosting `
                      -Arguments @("/install", "/quiet", "/norestart", "OPT_NO_RUNTIME=1", "OPT_NO_SHAREDFX=1") `
                      -TimeoutSeconds 600 `
                      -SuccessCodes @(0, 3010)

                    if ($code -eq 3010) {
                      Write-Host "STMS_REBOOT_REQUIRED"
                      exit 0
                    }
                  }

                  Write-Host "STMS_PHASE_OK"
                }
                catch {
                  [Console]::Error.WriteLine($_.Exception.Message)
                  exit 1
                }
                '@

                Invoke-RemotePhase `
                  -Name '01-Prerequisites' `
                  -Script $prerequisites `
                  -AllowReboot

                $sql = @'
                $ErrorActionPreference = "Stop"
                $ProgressPreference = "SilentlyContinue"

                function Decode([string]$value) {
                  [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($value))
                }

                function Run-Installer {
                  param(
                    [string]$FilePath,
                    [string[]]$Arguments,
                    [int]$TimeoutSeconds,
                    [int[]]$SuccessCodes = @(0),
                    [string]$LogPath
                  )

                  Write-Host "Starting installer: $FilePath"

                  $p = Start-Process `
                    -FilePath $FilePath `
                    -ArgumentList $Arguments `
                    -PassThru `
                    -NoNewWindow

                  $completed = $p.WaitForExit($TimeoutSeconds * 1000)

                  if (-not $completed) {
                    & taskkill.exe /PID $p.Id /T /F | Out-Null
                    throw "Installer timed out after $TimeoutSeconds seconds: $FilePath"
                  }

                  # Ensure the native process handle is finalized before reading ExitCode.
                  $p.WaitForExit()
                  $p.Refresh()
                  $exitCode = [int]$p.ExitCode

                  Write-Host "Installer exit code: $exitCode ($FilePath)"

                  if ($SuccessCodes -notcontains $exitCode) {
                    $logDetails = ""

                    if ($LogPath -and (Test-Path -LiteralPath $LogPath)) {
                      $tail = Get-Content -LiteralPath $LogPath -Tail 80 -ErrorAction SilentlyContinue
                      if ($tail) {
                        $logDetails = "`n--- Installer log tail: $LogPath ---`n$($tail -join [Environment]::NewLine)"
                      }
                    }

                    throw "Installer failed with exit code ${exitCode}: $FilePath$logDetails"
                  }

                  return $exitCode
                }

                try {
                  $sqlPassword = Decode "__SQL__"
                  $service = Get-Service "MSSQL`$SQLEXPRESS" -ErrorAction SilentlyContinue

                  if (-not $service) {
                    Write-Host "Downloading SQL Server 2022 Express offline media..."

                    $root = "C:\stms-prod-install"
                    $package = "$root\SQLEXPR_x64_ENU.exe"
                    $media = "$root\sql-media"

                    New-Item -ItemType Directory -Force -Path $root,$media | Out-Null

                    if (-not (Test-Path -LiteralPath $package)) {
                      Invoke-WebRequest `
                        -UseBasicParsing `
                        -Uri "https://go.microsoft.com/fwlink/?LinkID=2213259&clcid=0x409" `
                        -OutFile $package `
                        -TimeoutSec 1200
                    }

                    if ((Get-Item -LiteralPath $package).Length -lt 50MB) {
                      throw "SQL Server Express offline package is unexpectedly small."
                    }

                    $setup = Get-ChildItem `
                      -Path $media `
                      -Filter setup.exe `
                      -Recurse `
                      -ErrorAction SilentlyContinue |
                      Select-Object -First 1

                    if (-not $setup) {
                      Write-Host "Extracting SQL Server media..."
                      Run-Installer `
                        -FilePath $package `
                        -Arguments @("/x:`"$media`"", "/q") `
                        -TimeoutSeconds 600 |
                        Out-Null

                      $setup = Get-ChildItem `
                        -Path $media `
                        -Filter setup.exe `
                        -Recurse |
                        Select-Object -First 1
                    }

                    if (-not $setup) {
                      throw "SQL Server setup.exe was not found."
                    }

                    Write-Host "Installing SQL Server Express..."
                    $code = Run-Installer `
                      -FilePath $setup.FullName `
                      -Arguments @(
                        "/Q",
                        "/ACTION=Install",
                        "/FEATURES=SQLEngine",
                        "/INSTANCENAME=SQLEXPRESS",
                        "/SECURITYMODE=SQL",
                        "/SAPWD=`"$sqlPassword`"",
                        "/SQLSYSADMINACCOUNTS=`"BUILTIN\Administrators`"",
                        "/SQLSVCSTARTUPTYPE=Automatic",
                        "/TCPENABLED=0",
                        "/NPENABLED=0",
                        "/UPDATEENABLED=False",
                        "/IACCEPTSQLSERVERLICENSETERMS"
                      ) `
                      -TimeoutSeconds 1500 `
                      -SuccessCodes @(0, 1641, 3010)

                    if ($code -in @(1641, 3010)) {
                      Write-Host "STMS_REBOOT_REQUIRED"
                      exit 0
                    }

                    $service = Get-Service "MSSQL`$SQLEXPRESS" -ErrorAction SilentlyContinue
                  }

                  if (-not $service) {
                    throw "SQL Server Express service does not exist after installation."
                  }

                  if ($service.Status -ne "Running") {
                    Start-Service "MSSQL`$SQLEXPRESS"
                    (Get-Service "MSSQL`$SQLEXPRESS").WaitForStatus(
                      "Running",
                      [TimeSpan]::FromSeconds(60)
                    )
                  }

                  Write-Host "SQL Server Express is running."
                  Write-Host "STMS_PHASE_OK"
                }
                catch {
                  [Console]::Error.WriteLine($_.Exception.Message)
                  exit 1
                }
                '@

                $sql = $sql.Replace('__SQL__', $sql64)

                Invoke-RemotePhase `
                  -Name '02-SQL-Express' `
                  -Script $sql `
                  -AllowReboot

                $deploy = @'
                $ErrorActionPreference = "Stop"
                $ProgressPreference = "SilentlyContinue"

                function Decode([string]$value) {
                  [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($value))
                }

                try {
                  $backendUrl = Decode "__BACKEND__"
                  $frontendUrl = Decode "__FRONTEND__"
                  $sqlPassword = Decode "__SQL__"
                  $jwtKey = Decode "__JWT__"
                  $groqKey = Decode "__GROQ__"
                  $vmIp = Decode "__IP__"

                  $root = "C:\stms-prod-install"
                  $apiRoot = "C:\inetpub\stms-prod-api"
                  $webRoot = "C:\inetpub\stms-prod-web"
                  $backendZip = "$root\backend.zip"
                  $frontendZip = "$root\frontend.zip"
                  $apiStage = "$root\api-stage"
                  $webStage = "$root\web-stage"

                  New-Item -ItemType Directory -Force -Path $root,$apiRoot,$webRoot | Out-Null

                  Write-Host "Downloading application packages..."
                  Invoke-WebRequest -UseBasicParsing -Uri $backendUrl -OutFile $backendZip -TimeoutSec 600
                  Invoke-WebRequest -UseBasicParsing -Uri $frontendUrl -OutFile $frontendZip -TimeoutSec 600

                  Remove-Item -LiteralPath $apiStage -Recurse -Force -ErrorAction SilentlyContinue
                  Remove-Item -LiteralPath $webStage -Recurse -Force -ErrorAction SilentlyContinue

                  Expand-Archive -LiteralPath $backendZip -DestinationPath $apiStage -Force
                  Expand-Archive -LiteralPath $frontendZip -DestinationPath $webStage -Force

                  foreach ($required in @(
                    "$apiStage\Api.exe",
                    "$apiStage\stms-migrate.exe",
                    "$apiStage\web.config",
                    "$webStage\index.html",
                    "$webStage\web.config"
                  )) {
                    if (-not (Test-Path -LiteralPath $required)) {
                      throw "Deployment package file missing: $required"
                    }
                  }

                  $builder = New-Object System.Data.SqlClient.SqlConnectionStringBuilder
                  $builder.DataSource = "localhost\SQLEXPRESS"
                  $builder.InitialCatalog = "stms-prod-db"
                  $builder.UserID = "sa"
                  $builder.Password = $sqlPassword
                  $builder.Encrypt = $true
                  $builder.TrustServerCertificate = $true
                  $builder.MultipleActiveResultSets = $true
                  $builder.ConnectTimeout = 30
                  $connectionString = $builder.ConnectionString

                  $env:ASPNETCORE_ENVIRONMENT = "Production"
                  $env:DOTNET_ENVIRONMENT = "Production"
                  $env:ConnectionStrings__DefaultConnection = $connectionString

                  [Environment]::SetEnvironmentVariable("ASPNETCORE_ENVIRONMENT", "Production", "Machine")
                  [Environment]::SetEnvironmentVariable("DOTNET_ENVIRONMENT", "Production", "Machine")
                  [Environment]::SetEnvironmentVariable("ConnectionStrings__DefaultConnection", $connectionString, "Machine")
                  [Environment]::SetEnvironmentVariable("Cors__AllowedOrigins__0", "https://$vmIp", "Machine")
                  [Environment]::SetEnvironmentVariable("Cors__AllowedOrigins__1", "http://$vmIp", "Machine")
                  [Environment]::SetEnvironmentVariable("Jwt__Issuer", "https://$vmIp", "Machine")
                  [Environment]::SetEnvironmentVariable("Jwt__Audience", "https://$vmIp", "Machine")
                  [Environment]::SetEnvironmentVariable("Jwt__Key", $jwtKey, "Machine")
                  [Environment]::SetEnvironmentVariable("Ai__GroqApiKey", $groqKey, "Machine")

                  Write-Host "Applying EF migrations..."
                  & "$apiStage\stms-migrate.exe" --connection $connectionString

                  if ($LASTEXITCODE -ne 0) {
                    throw "Database migration failed with exit code $LASTEXITCODE."
                  }

                  Remove-Item "$apiRoot\*" -Recurse -Force -ErrorAction SilentlyContinue
                  Remove-Item "$webRoot\*" -Recurse -Force -ErrorAction SilentlyContinue

                  Copy-Item "$apiStage\*" $apiRoot -Recurse -Force
                  Copy-Item "$webStage\*" $webRoot -Recurse -Force

                  & icacls.exe $apiRoot /grant "IIS_IUSRS:(OI)(CI)RX" /T /C /Q | Out-Null
                  if ($LASTEXITCODE -ne 0) { throw "API ACL update failed." }

                  & icacls.exe $webRoot /grant "IIS_IUSRS:(OI)(CI)RX" /T /C /Q | Out-Null
                  if ($LASTEXITCODE -ne 0) { throw "Frontend ACL update failed." }

                  Write-Host "STMS_PHASE_OK"
                }
                catch {
                  [Console]::Error.WriteLine($_.Exception.Message)
                  exit 1
                }
                '@

                $deploy = $deploy.Replace('__BACKEND__', $backend64)
                $deploy = $deploy.Replace('__FRONTEND__', $frontend64)
                $deploy = $deploy.Replace('__SQL__', $sql64)
                $deploy = $deploy.Replace('__JWT__', $jwt64)
                $deploy = $deploy.Replace('__GROQ__', $groq64)
                $deploy = $deploy.Replace('__IP__', $ip64)

                Invoke-RemotePhase `
                  -Name '03-Application' `
                  -Script $deploy

                $iis = @'
                $ErrorActionPreference = "Stop"

                function Decode([string]$value) {
                  [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($value))
                }

                try {
                  $vmIp = Decode "__IP__"
                  $apiRoot = "C:\inetpub\stms-prod-api"
                  $webRoot = "C:\inetpub\stms-prod-web"

                  Import-Module WebAdministration

                  foreach ($pool in @("STMS-PROD-Web-Pool", "STMS-PROD-Api-Pool")) {
                    if (-not (Test-Path "IIS:\AppPools\$pool")) {
                      New-WebAppPool $pool | Out-Null
                    }

                    Set-ItemProperty "IIS:\AppPools\$pool" managedRuntimeVersion ""
                    Set-ItemProperty "IIS:\AppPools\$pool" enable32BitAppOnWin64 $false
                  }

                  if (Test-Path "IIS:\Sites\Default Web Site") {
                    Remove-Website "Default Web Site"
                  }

                  if (-not (Test-Path "IIS:\Sites\STMS-PROD")) {
                    New-Website `
                      -Name "STMS-PROD" `
                      -PhysicalPath $webRoot `
                      -ApplicationPool "STMS-PROD-Web-Pool" `
                      -Port 80 `
                      -IPAddress "*" |
                      Out-Null
                  }
                  else {
                    Set-ItemProperty "IIS:\Sites\STMS-PROD" physicalPath $webRoot
                    Set-ItemProperty "IIS:\Sites\STMS-PROD" applicationPool "STMS-PROD-Web-Pool"
                  }

                  if (Test-Path "IIS:\Sites\STMS-PROD\services") {
                    Remove-WebApplication -Site "STMS-PROD" -Name "services"
                  }

                  New-WebApplication `
                    -Site "STMS-PROD" `
                    -Name "services" `
                    -PhysicalPath $apiRoot `
                    -ApplicationPool "STMS-PROD-Api-Pool" |
                    Out-Null

                  $certificate = Get-ChildItem Cert:\LocalMachine\My |
                    Where-Object {
                      $_.Subject -eq "CN=$vmIp" -and
                      $_.NotAfter -gt (Get-Date).AddDays(30)
                    } |
                    Sort-Object NotAfter -Descending |
                    Select-Object -First 1

                  if (-not $certificate) {
                    $certificate = New-SelfSignedCertificate `
                      -Subject "CN=$vmIp" `
                      -CertStoreLocation "Cert:\LocalMachine\My" `
                      -KeyAlgorithm RSA `
                      -KeyLength 2048 `
                      -HashAlgorithm SHA256 `
                      -NotAfter (Get-Date).AddYears(1) `
                      -FriendlyName "STMS-PROD-$vmIp" `
                      -TextExtension @("2.5.29.17={text}IPAddress=$vmIp")
                  }

                  Get-WebBinding `
                    -Name "STMS-PROD" `
                    -Protocol https `
                    -ErrorAction SilentlyContinue |
                    Remove-WebBinding -ErrorAction SilentlyContinue

                  New-WebBinding `
                    -Name "STMS-PROD" `
                    -Protocol https `
                    -Port 443 `
                    -IPAddress "*" |
                    Out-Null

                  $binding = Get-WebBinding -Name "STMS-PROD" -Protocol https -Port 443
                  $binding.AddSslCertificate($certificate.Thumbprint, "My")

                  & iisreset.exe /restart | Out-Null

                  for ($attempt = 1; $attempt -le 12; $attempt++) {
                    try {
                      $health = Invoke-WebRequest `
                        -UseBasicParsing `
                        -Uri "http://localhost/services/health" `
                        -TimeoutSec 15

                      if ($health.StatusCode -eq 200) {
                        Write-Host "STMS_PHASE_OK"
                        exit 0
                      }
                    }
                    catch {
                      Start-Sleep -Seconds 5
                    }
                  }

                  throw "Local API health check failed."
                }
                catch {
                  [Console]::Error.WriteLine($_.Exception.Message)
                  exit 1
                }
                '@

                $iis = $iis.Replace('__IP__', $ip64)

                Invoke-RemotePhase `
                  -Name '04-IIS-and-HTTPS' `
                  -Script $iis

                Write-Host ""
                Write-Host "All VM configuration phases completed."


          - task: PowerShell@2
            displayName: Verify Production Site and API
            inputs:
              pwsh: true
              targetType: inline
              script: |
                $ErrorActionPreference = 'Stop'

                $siteUrl = "https://$(VM_PUBLIC_IP)/"
                $healthUrl = "https://$(VM_PUBLIC_IP)/services/health"

                $siteHealthy = $false
                $apiHealthy = $false

                for ($attempt = 1; $attempt -le 12; $attempt++) {
                    try {
                        $site = Invoke-WebRequest `
                          -Uri $siteUrl `
                          -SkipCertificateCheck `
                          -TimeoutSec 20

                        $health = Invoke-WebRequest `
                          -Uri $healthUrl `
                          -SkipCertificateCheck `
                          -TimeoutSec 20

                        $siteHealthy = $site.StatusCode -eq 200
                        $apiHealthy = $health.StatusCode -eq 200

                        if ($siteHealthy -and $apiHealthy) {
                            break
                        }
                    }
                    catch {
                        Write-Host "Smoke test attempt $attempt failed: $($_.Exception.Message)"
                    }

                    Start-Sleep -Seconds 10
                }

                if (-not $siteHealthy) {
                    throw "Frontend smoke test failed: $siteUrl"
                }

                if (-not $apiHealthy) {
                    throw "API health check failed: $healthUrl"
                }

                Write-Host '============================================'
                Write-Host 'PRODUCTION DEPLOYMENT SUCCESSFUL'
                Write-Host "Site: $siteUrl"
                Write-Host "Health: $healthUrl"
                Write-Host "VM size: $(vmSize)"
                Write-Host '============================================'

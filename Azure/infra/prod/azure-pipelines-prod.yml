trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

variables:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

  azureLocation: 'southeastasia'
  resourceGroup: 'stms-prod-rg'
  vmName: 'stms-prod-vm'
  storageAccount: 'stmsprodartifacts'
  storageContainer: 'deployments'

  efToolsVersion: '10.0.9'

stages:

- stage: Preflight
  displayName: Azure Quota Check
  jobs:
  - job: CheckQuota
    pool:
      vmImage: 'windows-latest'
    steps:
    - checkout: none

    - task: AzureCLI@2
      displayName: Check VM Quota
      condition: ne(variables['Build.Reason'], 'PullRequest')
      inputs:
        azureSubscription: 'STMS-Azure-Service-Connection'
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'

          $candidates = @(
            'Standard_B2s_v2',
            'Standard_B2as_v2',
            'Standard_D2as_v5',
            'Standard_D2s_v5'
          )

          $usage = (az vm list-usage --location "$(azureLocation)" --output json --only-show-errors | Out-String) | ConvertFrom-Json
          $skus = (az vm list-skus --location "$(azureLocation)" --resource-type virtualMachines --all --output json --only-show-errors | Out-String) | ConvertFrom-Json

          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to query Azure VM quota/SKUs.'
          }

          $regional = $usage | Where-Object { $_.name.value -eq 'cores' } | Select-Object -First 1
          $found = $false

          foreach ($name in $candidates) {
            $sku = $skus | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if (-not $sku) { continue }

            $vcpu = [int](($sku.capabilities | Where-Object { $_.name -eq 'vCPUs' } | Select-Object -First 1).value)
            $familyQuota = $usage | Where-Object { $_.name.value -eq $sku.family } | Select-Object -First 1

            if (-not $familyQuota) { continue }

            $familyRemaining = [int]$familyQuota.limit - [int]$familyQuota.currentValue
            $regionalRemaining = if ($regional) { [int]$regional.limit - [int]$regional.currentValue } else { 999999 }

            Write-Host "$name : family=$($sku.family), required=$vcpu, familyRemaining=$familyRemaining, regionalRemaining=$regionalRemaining"

            if ($familyRemaining -ge $vcpu -and $regionalRemaining -ge $vcpu) {
              $found = $true
              break
            }
          }

          if (-not $found) {
            throw 'No approved VM family has enough vCPU quota in southeastasia. Request quota or add a VM family that has quota.'
          }

          Write-Host 'VM quota check passed.'

- stage: Build
  displayName: Build and Test
  dependsOn: Preflight
  condition: in(dependencies.Preflight.result, 'Succeeded', 'SucceededWithIssues')

  jobs:

  - job: Backend
    displayName: Build Test Publish Backend
    pool:
      vmImage: 'windows-latest'

    steps:
    - checkout: self
      clean: true

    - task: UseDotNet@2
      displayName: Install .NET 10 SDK
      inputs:
        packageType: sdk
        version: '10.0.x'

    - task: PowerShell@2
      displayName: Restore Build Test
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'

          Set-Location "$(Build.SourcesDirectory)"

          & dotnet restore
          if ($LASTEXITCODE -ne 0) {
              throw 'dotnet restore failed.'
          }

          & dotnet build --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) {
              throw 'dotnet build failed.'
          }

          & dotnet test `
            "$(Build.SourcesDirectory)\Infrastructure.Tests\Infrastructure.Tests.csproj" `
            --configuration Release `
            --no-build `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
              throw 'dotnet test failed.'
          }

    - task: PowerShell@2
      displayName: Publish API
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'

          $publishDirectory = "$(Build.ArtifactStagingDirectory)\api"
          Remove-Item -LiteralPath $publishDirectory -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $publishDirectory | Out-Null

          & dotnet publish `
            "$(Build.SourcesDirectory)\Api\Api.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output $publishDirectory

          if ($LASTEXITCODE -ne 0) {
              throw 'API publish failed.'
          }

          if (-not (Test-Path -LiteralPath "$publishDirectory\Api.exe")) {
              throw "Self-contained API executable was not produced: $publishDirectory\Api.exe"
          }

          if (-not (Test-Path -LiteralPath "$publishDirectory\web.config")) {
              throw "IIS web.config was not produced by dotnet publish."
          }

    - task: PowerShell@2
      displayName: Create EF Migration Bundle
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'

          Set-Location "$(Build.SourcesDirectory)"

          $toolPath = "$(Agent.TempDirectory)\ef-tools"
          $efTool = "$toolPath\dotnet-ef.exe"
          $bundleDirectory = "$(Build.ArtifactStagingDirectory)\efbundle"
          $bundleOutput = "$bundleDirectory\stms-migrate.exe"
          $apiPublishDirectory = "$(Build.ArtifactStagingDirectory)\api"

          Remove-Item -LiteralPath $toolPath -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $bundleDirectory -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path $toolPath,$bundleDirectory | Out-Null

          & dotnet tool install `
            --tool-path $toolPath `
            dotnet-ef `
            --version "$(efToolsVersion)"

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet-ef $(efToolsVersion) installation failed."
          }

          if (-not (Test-Path -LiteralPath $efTool)) {
              throw "dotnet-ef executable not found at $efTool"
          }

          $env:ASPNETCORE_ENVIRONMENT = 'Production'
          $env:DOTNET_ENVIRONMENT = 'Production'

          & $efTool migrations bundle `
            --project "$(Build.SourcesDirectory)\Infrastructure\Infrastructure.csproj" `
            --startup-project "$(Build.SourcesDirectory)\Api\Api.csproj" `
            --configuration Release `
            --target-runtime win-x64 `
            --self-contained `
            --output $bundleOutput `
            --force `
            --verbose

          if ($LASTEXITCODE -ne 0) {
              throw 'EF Core migration bundle generation failed.'
          }

          if (-not (Test-Path -LiteralPath $bundleOutput)) {
              throw "Migration bundle was not created: $bundleOutput"
          }

          Copy-Item -LiteralPath $bundleOutput -Destination "$apiPublishDirectory\stms-migrate.exe" -Force

          if (-not (Test-Path -LiteralPath "$apiPublishDirectory\stms-migrate.exe")) {
              throw 'Migration bundle was not copied into the API deployment package.'
          }

          $bundle = Get-Item -LiteralPath "$apiPublishDirectory\stms-migrate.exe"
          Write-Host "EF bundle ready: $($bundle.FullName) ($([Math]::Round($bundle.Length / 1MB, 2)) MB)"

    - task: ArchiveFiles@2
      displayName: Package Backend
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)\api'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)\backend.zip'
        replaceExistingArchive: true

    - publish: '$(Build.ArtifactStagingDirectory)\backend.zip'
      artifact: backend

  - job: Frontend
    displayName: Build Angular Frontend
    pool:
      vmImage: 'windows-latest'

    steps:
    - checkout: self
      clean: true

    - task: NodeTool@0
      displayName: Install Node 22
      inputs:
        versionSpec: '22.x'

    - task: PowerShell@2
      displayName: Verify Production API Base URL
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'

          $file = "$(Build.SourcesDirectory)\Frontend\Angular\src\environments\environment.prod.ts"

          if (-not (Test-Path -LiteralPath $file)) {
              throw "Angular production environment file not found: $file"
          }

          $content = Get-Content -LiteralPath $file -Raw

          if ($content -notmatch "apiBaseUrl\s*:\s*'/services/api'") {
              throw "environment.prod.ts must use apiBaseUrl: '/services/api'"
          }

    - task: PowerShell@2
      displayName: Build Angular
      inputs:
        pwsh: true
        targetType: inline
        workingDirectory: '$(Build.SourcesDirectory)\Frontend\Angular'
        script: |
          $ErrorActionPreference = 'Stop'

          & npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {
              throw 'npm ci failed.'
          }

          & npm run build:prod
          if ($LASTEXITCODE -ne 0) {
              throw 'Angular production build failed.'
          }

    - task: PowerShell@2
      displayName: Create IIS web.config
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'

          $frontend = "$(Build.SourcesDirectory)\Frontend\Angular\dist\smart-task-management-system\browser"

          if (-not (Test-Path -LiteralPath "$frontend\index.html")) {
              throw 'Angular index.html is missing from the production build.'
          }

          $webConfig = @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>

              <rewrite>
                <rules>

                  <rule name="Angular Routes" stopProcessing="true">
                    <match url=".*" />

                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                      <add input="{REQUEST_URI}" pattern="^/services" negate="true" />
                      <add input="{REQUEST_URI}" pattern="^/api" negate="true" />
                    </conditions>

                    <action type="Rewrite" url="/index.html" />
                  </rule>

                </rules>
              </rewrite>

              <staticContent>
                <remove fileExtension=".json" />
                <mimeMap fileExtension=".json" mimeType="application/json" />
              </staticContent>

            </system.webServer>
          </configuration>
          '@

          Set-Content -LiteralPath "$frontend\web.config" -Value $webConfig -Encoding utf8

          [xml](Get-Content -LiteralPath "$frontend\web.config" -Raw) | Out-Null

    - task: ArchiveFiles@2
      displayName: Package Angular
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)\Frontend\Angular\dist\smart-task-management-system\browser'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)\frontend.zip'
        replaceExistingArchive: true

    - publish: '$(Build.ArtifactStagingDirectory)\frontend.zip'
      artifact: frontend

- stage: Deploy
  displayName: Deploy Production
  dependsOn:
    - Build

  condition: |
    and(
      succeeded(),
      ne(variables['Build.Reason'], 'PullRequest')
    )

  jobs:
  - deployment: DeployProduction
    displayName: Deploy STMS Production
    environment: Production

    pool:
      vmImage: 'windows-latest'

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            clean: true

          - download: current
            artifact: backend

          - download: current
            artifact: frontend

          - task: AzureCLI@2
            displayName: Deploy Azure Infrastructure
            env:
              VM_ADMIN_PASSWORD: $(VM_ADMIN_PASSWORD)
            inputs:
              azureSubscription: 'STMS-Azure-Service-Connection'
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'

                $root = "$(Build.SourcesDirectory)\Azure\infra\prod"
                $paramFile = "@$root\parameters\vm-windows-prod.json"

                az deployment sub create `
                  --name stms-prod-rg-deployment `
                  --location "$(azureLocation)" `
                  --template-file "$root\rg.bicep" `
                  --parameters location="$(azureLocation)" resourceGroupName="$(resourceGroup)" `
                  --only-show-errors `
                  --output none

                if ($LASTEXITCODE -ne 0) { throw 'Resource group deployment failed.' }

                az deployment group create `
                  --name stms-prod-storage-deployment `
                  --resource-group "$(resourceGroup)" `
                  --template-file "$root\storage.bicep" `
                  --parameters location="$(azureLocation)" storageAccountName="$(storageAccount)" containerName="$(storageContainer)" `
                  --only-show-errors `
                  --output none

                if ($LASTEXITCODE -ne 0) { throw 'Storage deployment failed.' }

                $candidates = @(
                  'Standard_B2s_v2',
                  'Standard_B2as_v2',
                  'Standard_D2as_v5',
                  'Standard_D2s_v5'
                )

                $usage = (az vm list-usage --location "$(azureLocation)" --output json --only-show-errors | Out-String) | ConvertFrom-Json
                $skus = (az vm list-skus --location "$(azureLocation)" --resource-type virtualMachines --all --output json --only-show-errors | Out-String) | ConvertFrom-Json
                $regional = $usage | Where-Object { $_.name.value -eq 'cores' } | Select-Object -First 1

                $deployed = $null
                $retryable = 'QuotaExceeded|SkuNotAvailable|AllocationFailed|ZonalAllocationFailed|OverconstrainedAllocationRequest|Capacity Restrictions'

                foreach ($name in $candidates) {
                  $sku = $skus | Where-Object { $_.name -eq $name } | Select-Object -First 1
                  if (-not $sku) { continue }

                  $vcpu = [int](($sku.capabilities | Where-Object { $_.name -eq 'vCPUs' } | Select-Object -First 1).value)
                  $familyQuota = $usage | Where-Object { $_.name.value -eq $sku.family } | Select-Object -First 1

                  if ($familyQuota) {
                    $familyRemaining = [int]$familyQuota.limit - [int]$familyQuota.currentValue
                    $regionalRemaining = if ($regional) { [int]$regional.limit - [int]$regional.currentValue } else { 999999 }

                    if ($familyRemaining -lt $vcpu -or $regionalRemaining -lt $vcpu) {
                      Write-Host "Skipping $name: insufficient quota."
                      continue
                    }
                  }

                  Write-Host "Deploying VM with $name..."

                  $result = az deployment group create `
                    --name stms-prod-vm-deployment `
                    --resource-group "$(resourceGroup)" `
                    --template-file "$root\vm-windows.bicep" `
                    --parameters $paramFile adminPassword="$env:VM_ADMIN_PASSWORD" vmSize="$name" `
                    --only-show-errors `
                    --output none 2>&1

                  if ($LASTEXITCODE -eq 0) {
                    $deployed = $name
                    break
                  }

                  $errorText = $result | Out-String

                  if ($errorText -match $retryable) {
                    Write-Warning "$name rejected by Azure; trying next size."
                    continue
                  }

                  Write-Host $errorText
                  throw "VM deployment failed for $name."
                }

                if (-not $deployed) {
                  throw 'No approved VM size could be deployed. Check vCPU quota in southeastasia.'
                }

                $pipName = az deployment group show `
                  --resource-group "$(resourceGroup)" `
                  --name stms-prod-vm-deployment `
                  --query properties.outputs.publicIpName.value `
                  --output tsv

                $vmIp = az network public-ip show `
                  --resource-group "$(resourceGroup)" `
                  --name $pipName `
                  --query ipAddress `
                  --output tsv

                if ([string]::IsNullOrWhiteSpace($vmIp)) {
                  throw 'Could not resolve VM public IP.'
                }

                Write-Host "VM: $deployed"
                Write-Host "IP: $vmIp"
                Write-Host "##vso[task.setvariable variable=DEPLOYED_VM_SIZE]$deployed"
                Write-Host "##vso[task.setvariable variable=VM_PUBLIC_IP]$vmIp"

          - task: AzureCLI@2
            displayName: Upload Deployment Packages
            inputs:
              azureSubscription: 'STMS-Azure-Service-Connection'
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'

                $backend = "$(Pipeline.Workspace)\backend\backend.zip"
                $frontend = "$(Pipeline.Workspace)\frontend\frontend.zip"

                foreach ($artifact in @($backend, $frontend)) {
                    if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
                        throw "Pipeline artifact not found: $artifact"
                    }

                    if ((Get-Item -LiteralPath $artifact).Length -eq 0) {
                        throw "Pipeline artifact is empty: $artifact"
                    }
                }

                $storageKey = & az storage account keys list `
                  --account-name "$(storageAccount)" `
                  --resource-group "$(resourceGroup)" `
                  --query '[0].value' `
                  --output tsv `
                  --only-show-errors

                if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($storageKey)) {
                    throw 'Unable to obtain the deployment storage account key.'
                }

                Write-Host "##vso[task.setsecret]$storageKey"

                $backendBlob = "backend-$(Build.BuildId).zip"
                $frontendBlob = "frontend-$(Build.BuildId).zip"

                & az storage blob upload `
                  --account-name "$(storageAccount)" `
                  --account-key $storageKey `
                  --container-name "$(storageContainer)" `
                  --name $backendBlob `
                  --file $backend `
                  --overwrite true `
                  --only-show-errors `
                  --output none

                if ($LASTEXITCODE -ne 0) {
                    throw 'Backend package upload failed.'
                }

                & az storage blob upload `
                  --account-name "$(storageAccount)" `
                  --account-key $storageKey `
                  --container-name "$(storageContainer)" `
                  --name $frontendBlob `
                  --file $frontend `
                  --overwrite true `
                  --only-show-errors `
                  --output none

                if ($LASTEXITCODE -ne 0) {
                    throw 'Frontend package upload failed.'
                }

                $expiry = (Get-Date).ToUniversalTime().AddHours(2).ToString('yyyy-MM-ddTHH:mm:ssZ')

                $backendSas = & az storage blob generate-sas `
                  --account-name "$(storageAccount)" `
                  --account-key $storageKey `
                  --container-name "$(storageContainer)" `
                  --name $backendBlob `
                  --permissions r `
                  --https-only `
                  --expiry $expiry `
                  --output tsv `
                  --only-show-errors

                if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($backendSas)) {
                    throw 'Backend SAS generation failed.'
                }

                $frontendSas = & az storage blob generate-sas `
                  --account-name "$(storageAccount)" `
                  --account-key $storageKey `
                  --container-name "$(storageContainer)" `
                  --name $frontendBlob `
                  --permissions r `
                  --https-only `
                  --expiry $expiry `
                  --output tsv `
                  --only-show-errors

                if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($frontendSas)) {
                    throw 'Frontend SAS generation failed.'
                }

                $backendUrl = "https://$(storageAccount).blob.core.windows.net/$(storageContainer)/$backendBlob?$backendSas"
                $frontendUrl = "https://$(storageAccount).blob.core.windows.net/$(storageContainer)/$frontendBlob?$frontendSas"

                Write-Host "##vso[task.setsecret]$backendUrl"
                Write-Host "##vso[task.setsecret]$frontendUrl"

                Write-Host "##vso[task.setvariable variable=BACKEND_PACKAGE_URL;issecret=true]$backendUrl"
                Write-Host "##vso[task.setvariable variable=FRONTEND_PACKAGE_URL;issecret=true]$frontendUrl"

          - task: AzureCLI@2
            displayName: Configure IIS SQL Server and Deploy
            env:
              SQL_SA_PASSWORD: $(SQL_SA_PASSWORD)
              JWT_KEY: $(JWT_KEY)
              GROQ_API_KEY: $(GROQ_API_KEY)
              BACKEND_PACKAGE_URL: $(BACKEND_PACKAGE_URL)
              FRONTEND_PACKAGE_URL: $(FRONTEND_PACKAGE_URL)
            inputs:
              azureSubscription: 'STMS-Azure-Service-Connection'
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'

                function Encode {
                    param([Parameter(Mandatory = $true)][string]$Value)
                    return [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($Value))
                }

                foreach ($required in @(
                    'SQL_SA_PASSWORD',
                    'JWT_KEY',
                    'GROQ_API_KEY',
                    'BACKEND_PACKAGE_URL',
                    'FRONTEND_PACKAGE_URL'
                )) {
                    $value = [Environment]::GetEnvironmentVariable($required)
                    if ([string]::IsNullOrWhiteSpace($value)) {
                        throw "Required deployment environment variable is empty: $required"
                    }
                }

                $backend64 = Encode $env:BACKEND_PACKAGE_URL
                $frontend64 = Encode $env:FRONTEND_PACKAGE_URL
                $sql64 = Encode $env:SQL_SA_PASSWORD
                $jwt64 = Encode $env:JWT_KEY
                $groq64 = Encode $env:GROQ_API_KEY
                $ip64 = Encode "$(VM_PUBLIC_IP)"

                $script = @'
                $ErrorActionPreference = "Stop"
                $ProgressPreference = "SilentlyContinue"

                function Decode {
                    param([Parameter(Mandatory = $true)][string]$Value)
                    return [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($Value))
                }

                function Invoke-CheckedProcess {
                    param(
                        [Parameter(Mandatory = $true)][string]$FilePath,
                        [string[]]$ArgumentList = @(),
                        [int[]]$SuccessExitCodes = @(0)
                    )

                    $process = Start-Process `
                        -FilePath $FilePath `
                        -ArgumentList $ArgumentList `
                        -Wait `
                        -PassThru `
                        -NoNewWindow

                    if ($SuccessExitCodes -notcontains $process.ExitCode) {
                        throw "Process failed with exit code $($process.ExitCode): $FilePath"
                    }

                    return $process.ExitCode
                }

                try {
                    $BackendUrl = Decode "__BACKEND__"
                    $FrontendUrl = Decode "__FRONTEND__"
                    $SqlPassword = Decode "__SQL__"
                    $JwtKey = Decode "__JWT__"
                    $GroqKey = Decode "__GROQ__"
                    $VmIp = Decode "__IP__"

                    $InstallRoot = "C:\stms-prod-install"
                    $ApiRoot = "C:\inetpub\stms-prod-api"
                    $WebRoot = "C:\inetpub\stms-prod-web"

                    New-Item -ItemType Directory -Force -Path $InstallRoot,$ApiRoot,$WebRoot | Out-Null

                    $featureResult = Install-WindowsFeature `
                        Web-Server, `
                        Web-Static-Content, `
                        Web-Default-Doc, `
                        Web-Http-Errors, `
                        Web-Http-Logging, `
                        Web-Filtering, `
                        Web-Stat-Compression, `
                        Web-Mgmt-Console, `
                        Web-WebSockets `
                        -IncludeManagementTools

                    if (-not $featureResult.Success) {
                        throw "IIS feature installation failed."
                    }

                    if ($featureResult.RestartNeeded -eq "Yes") {
                        Write-Host "STMS_REBOOT_REQUIRED"
                        exit 0
                    }

                    $sqlService = Get-Service "MSSQL`$SQLEXPRESS" -ErrorAction SilentlyContinue

                    if (-not $sqlService) {
                        $bootstrapper = "$InstallRoot\SQL2022-SSEI-Expr.exe"
                        $bootstrapperUri = "https://download.microsoft.com/download/5/1/4/5145fe04-4d30-4b85-b0d1-39533663a2f1/SQL2022-SSEI-Expr.exe"
                        $media = "$InstallRoot\sql-media"
                        $extracted = "$InstallRoot\sql"

                        New-Item -ItemType Directory -Force -Path $media,$extracted | Out-Null

                        $sqlPackage = Get-ChildItem `
                            -Path $media `
                            -Filter "SQLEXPR*x64*.exe" `
                            -Recurse `
                            -ErrorAction SilentlyContinue |
                            Select-Object -First 1

                        if (-not $sqlPackage) {
                            if (-not (Test-Path -LiteralPath $bootstrapper)) {
                                Invoke-WebRequest -Uri $bootstrapperUri -OutFile $bootstrapper
                            }

                            if ((Get-Item -LiteralPath $bootstrapper).Length -lt 1MB) {
                                throw "SQL Server 2022 Express bootstrapper download is unexpectedly small."
                            }

                            $downloadExit = Invoke-CheckedProcess `
                                -FilePath $bootstrapper `
                                -ArgumentList @(
                                    "/ACTION=Download",
                                    "/MEDIATYPE=Core",
                                    "/MEDIAPATH=`"$media`"",
                                    "/QUIET",
                                    "/IACCEPTSQLSERVERLICENSETERMS"
                                )

                            $sqlPackage = Get-ChildItem `
                                -Path $media `
                                -Filter "SQLEXPR*x64*.exe" `
                                -Recurse |
                                Select-Object -First 1
                        }

                        if (-not $sqlPackage) {
                            throw "SQL Server 2022 Express Core media was not downloaded."
                        }

                        $setup = Get-ChildItem `
                            -Path $extracted `
                            -Filter "setup.exe" `
                            -Recurse `
                            -ErrorAction SilentlyContinue |
                            Select-Object -First 1

                        if (-not $setup) {
                            Invoke-CheckedProcess `
                                -FilePath $sqlPackage.FullName `
                                -ArgumentList @("/x:`"$extracted`"", "/q") |
                                Out-Null

                            $setup = Get-ChildItem `
                                -Path $extracted `
                                -Filter "setup.exe" `
                                -Recurse |
                                Select-Object -First 1
                        }

                        if (-not $setup) {
                            throw "SQL Server setup.exe was not found after media extraction."
                        }

                        $sqlExit = Invoke-CheckedProcess `
                            -FilePath $setup.FullName `
                            -ArgumentList @(
                                "/Q",
                                "/ACTION=Install",
                                "/FEATURES=SQLENGINE",
                                "/INSTANCENAME=SQLEXPRESS",
                                "/SECURITYMODE=SQL",
                                "/SAPWD=`"$SqlPassword`"",
                                "/SQLSYSADMINACCOUNTS=`"BUILTIN\Administrators`"",
                                "/SQLSVCSTARTUPTYPE=Automatic",
                                "/TCPENABLED=0",
                                "/NPENABLED=0",
                                "/UPDATEENABLED=False",
                                "/IACCEPTSQLSERVERLICENSETERMS"
                            ) `
                            -SuccessExitCodes @(0, 1641, 3010)

                        if ($sqlExit -in @(1641, 3010)) {
                            Write-Host "STMS_REBOOT_REQUIRED"
                            exit 0
                        }

                        for ($attempt = 1; $attempt -le 30; $attempt++) {
                            $sqlService = Get-Service "MSSQL`$SQLEXPRESS" -ErrorAction SilentlyContinue
                            if ($sqlService) {
                                break
                            }
                            Start-Sleep -Seconds 2
                        }

                        if (-not $sqlService) {
                            throw "SQL Server Express service was not created."
                        }
                    }

                    if ($sqlService.Status -ne "Running") {
                        Start-Service "MSSQL`$SQLEXPRESS"
                        (Get-Service "MSSQL`$SQLEXPRESS").WaitForStatus("Running", [TimeSpan]::FromSeconds(60))
                    }

                    $rewriteDll = "C:\Windows\System32\inetsrv\rewrite.dll"

                    if (-not (Test-Path -LiteralPath $rewriteDll)) {
                        $rewriteMsi = "$InstallRoot\rewrite.msi"

                        if (-not (Test-Path -LiteralPath $rewriteMsi)) {
                            Invoke-WebRequest `
                                -Uri "https://download.microsoft.com/download/D/D/9/DD9A82D0-52EF-40DB-8D13-4B2325F124BE/rewrite_amd64_en-US.msi" `
                                -OutFile $rewriteMsi
                        }

                        $rewriteExit = Invoke-CheckedProcess `
                            -FilePath "msiexec.exe" `
                            -ArgumentList @("/i", "`"$rewriteMsi`"", "/quiet", "/norestart") `
                            -SuccessExitCodes @(0, 1641, 3010)

                        if ($rewriteExit -in @(1641, 3010)) {
                            Write-Host "STMS_REBOOT_REQUIRED"
                            exit 0
                        }
                    }

                    $ancm = "C:\Program Files\IIS\Asp.Net Core Module\V2\aspnetcorev2.dll"

                    if (-not (Test-Path -LiteralPath $ancm)) {
                        $hostingBundle = "$InstallRoot\dotnet-hosting-10-current-win.exe"

                        if (-not (Test-Path -LiteralPath $hostingBundle)) {
                            Invoke-WebRequest `
                                -Uri "https://aka.ms/dotnetcore-10-0-windowshosting" `
                                -OutFile $hostingBundle
                        }

                        $hostingExit = Invoke-CheckedProcess `
                            -FilePath $hostingBundle `
                            -ArgumentList @("/install", "/quiet", "/norestart", "OPT_NO_RUNTIME=1", "OPT_NO_SHAREDFX=1", "OPT_NO_X86=1") `
                            -SuccessExitCodes @(0, 1641, 3010)

                        if ($hostingExit -in @(1641, 3010)) {
                            Write-Host "STMS_REBOOT_REQUIRED"
                            exit 0
                        }
                    }

                    if (-not (Test-Path -LiteralPath $ancm)) {
                        throw "ASP.NET Core Module V2 was not installed."
                    }

                    $backendZip = "$InstallRoot\backend.zip"
                    $frontendZip = "$InstallRoot\frontend.zip"

                    Invoke-WebRequest -Uri $BackendUrl -OutFile $backendZip
                    Invoke-WebRequest -Uri $FrontendUrl -OutFile $frontendZip

                    if ((Get-Item -LiteralPath $backendZip).Length -eq 0) {
                        throw "Downloaded backend package is empty."
                    }

                    if ((Get-Item -LiteralPath $frontendZip).Length -eq 0) {
                        throw "Downloaded frontend package is empty."
                    }

                    $apiStage = "$InstallRoot\api-stage"
                    $webStage = "$InstallRoot\web-stage"

                    Remove-Item -LiteralPath $apiStage -Force -Recurse -ErrorAction SilentlyContinue
                    Remove-Item -LiteralPath $webStage -Force -Recurse -ErrorAction SilentlyContinue

                    Expand-Archive -LiteralPath $backendZip -DestinationPath $apiStage -Force
                    Expand-Archive -LiteralPath $frontendZip -DestinationPath $webStage -Force

                    if (-not (Test-Path -LiteralPath "$apiStage\Api.exe")) {
                        throw "Api.exe is missing from the backend deployment package."
                    }

                    if (-not (Test-Path -LiteralPath "$apiStage\stms-migrate.exe")) {
                        throw "stms-migrate.exe is missing from the backend deployment package."
                    }

                    if (-not (Test-Path -LiteralPath "$apiStage\web.config")) {
                        throw "API web.config is missing from the backend deployment package."
                    }

                    if (-not (Test-Path -LiteralPath "$webStage\index.html")) {
                        throw "index.html is missing from the frontend deployment package."
                    }

                    if (-not (Test-Path -LiteralPath "$webStage\web.config")) {
                        throw "Angular web.config is missing from the frontend deployment package."
                    }

                    $connectionBuilder = New-Object System.Data.SqlClient.SqlConnectionStringBuilder
                    $connectionBuilder.DataSource = "localhost\SQLEXPRESS"
                    $connectionBuilder.InitialCatalog = "stms-prod-db"
                    $connectionBuilder.UserID = "sa"
                    $connectionBuilder.Password = $SqlPassword
                    $connectionBuilder.Encrypt = $true
                    $connectionBuilder.TrustServerCertificate = $true
                    $connectionBuilder.MultipleActiveResultSets = $true
                    $connectionBuilder.ConnectTimeout = 30

                    $ConnectionString = $connectionBuilder.ConnectionString

                    $env:ASPNETCORE_ENVIRONMENT = "Production"
                    $env:DOTNET_ENVIRONMENT = "Production"
                    $env:ConnectionStrings__DefaultConnection = $ConnectionString

                    [Environment]::SetEnvironmentVariable("ASPNETCORE_ENVIRONMENT", "Production", "Machine")
                    [Environment]::SetEnvironmentVariable("DOTNET_ENVIRONMENT", "Production", "Machine")
                    [Environment]::SetEnvironmentVariable("ConnectionStrings__DefaultConnection", $ConnectionString, "Machine")
                    [Environment]::SetEnvironmentVariable("Cors__AllowedOrigins__0", "https://$VmIp", "Machine")
                    [Environment]::SetEnvironmentVariable("Cors__AllowedOrigins__1", "http://$VmIp", "Machine")
                    [Environment]::SetEnvironmentVariable("Jwt__Issuer", "https://$VmIp", "Machine")
                    [Environment]::SetEnvironmentVariable("Jwt__Audience", "https://$VmIp", "Machine")
                    [Environment]::SetEnvironmentVariable("Jwt__Key", $JwtKey, "Machine")
                    [Environment]::SetEnvironmentVariable("Ai__GroqApiKey", $GroqKey, "Machine")

                    & "$apiStage\stms-migrate.exe" --connection $ConnectionString

                    if ($LASTEXITCODE -ne 0) {
                        throw "Database migration failed with exit code $LASTEXITCODE."
                    }

                    Import-Module WebAdministration

                    if (Test-Path "IIS:\Sites\STMS-PROD") {
                        Stop-Website "STMS-PROD" -ErrorAction SilentlyContinue
                    }

                    Remove-Item "$ApiRoot\*" -Recurse -Force -ErrorAction SilentlyContinue
                    Remove-Item "$WebRoot\*" -Recurse -Force -ErrorAction SilentlyContinue

                    Copy-Item "$apiStage\*" $ApiRoot -Recurse -Force
                    Copy-Item "$webStage\*" $WebRoot -Recurse -Force

                    & icacls $ApiRoot /grant "IIS_IUSRS:(OI)(CI)RX" /T /C /Q | Out-Null
                    if ($LASTEXITCODE -ne 0) {
                        throw "Failed to grant IIS read/execute access to the API directory."
                    }

                    & icacls $WebRoot /grant "IIS_IUSRS:(OI)(CI)RX" /T /C /Q | Out-Null
                    if ($LASTEXITCODE -ne 0) {
                        throw "Failed to grant IIS read/execute access to the frontend directory."
                    }

                    foreach ($pool in @("STMS-PROD-Web-Pool", "STMS-PROD-Api-Pool")) {
                        if (-not (Test-Path "IIS:\AppPools\$pool")) {
                            New-WebAppPool $pool | Out-Null
                        }

                        Set-ItemProperty "IIS:\AppPools\$pool" managedRuntimeVersion ""
                        Set-ItemProperty "IIS:\AppPools\$pool" enable32BitAppOnWin64 $false
                    }

                    if (Test-Path "IIS:\Sites\Default Web Site") {
                        Remove-Website "Default Web Site"
                    }

                    if (-not (Test-Path "IIS:\Sites\STMS-PROD")) {
                        New-Website `
                            -Name "STMS-PROD" `
                            -PhysicalPath $WebRoot `
                            -ApplicationPool "STMS-PROD-Web-Pool" `
                            -Port 80 `
                            -IPAddress "*" |
                            Out-Null
                    }
                    else {
                        Set-ItemProperty "IIS:\Sites\STMS-PROD" physicalPath $WebRoot
                        Set-ItemProperty "IIS:\Sites\STMS-PROD" applicationPool "STMS-PROD-Web-Pool"
                    }

                    if (Test-Path "IIS:\Sites\STMS-PROD\services") {
                        Remove-WebApplication -Site "STMS-PROD" -Name "services"
                    }

                    New-WebApplication `
                        -Site "STMS-PROD" `
                        -Name "services" `
                        -PhysicalPath $ApiRoot `
                        -ApplicationPool "STMS-PROD-Api-Pool" |
                        Out-Null

                    $certificate = Get-ChildItem Cert:\LocalMachine\My |
                        Where-Object {
                            $_.Subject -eq "CN=$VmIp" -and
                            $_.NotAfter -gt (Get-Date).AddDays(30)
                        } |
                        Sort-Object NotAfter -Descending |
                        Select-Object -First 1

                    if (-not $certificate) {
                        $certificate = New-SelfSignedCertificate `
                            -Subject "CN=$VmIp" `
                            -CertStoreLocation "Cert:\LocalMachine\My" `
                            -KeyAlgorithm RSA `
                            -KeyLength 2048 `
                            -HashAlgorithm SHA256 `
                            -NotAfter (Get-Date).AddYears(1) `
                            -FriendlyName "STMS-PROD-$VmIp" `
                            -TextExtension @("2.5.29.17={text}IPAddress=$VmIp")
                    }

                    if (-not $certificate.HasPrivateKey) {
                        throw "HTTPS certificate does not contain a private key."
                    }

                    Get-WebBinding `
                        -Name "STMS-PROD" `
                        -Protocol https `
                        -ErrorAction SilentlyContinue |
                        Remove-WebBinding -ErrorAction SilentlyContinue

                    New-WebBinding `
                        -Name "STMS-PROD" `
                        -Protocol https `
                        -Port 443 `
                        -IPAddress "*" |
                        Out-Null

                    $httpsBinding = Get-WebBinding `
                        -Name "STMS-PROD" `
                        -Protocol https `
                        -Port 443

                    if (-not $httpsBinding) {
                        throw "IIS HTTPS binding was not created."
                    }

                    $httpsBinding.AddSslCertificate($certificate.Thumbprint, "My")

                    & iisreset /restart | Out-Null

                    $healthy = $false

                    for ($attempt = 1; $attempt -le 12; $attempt++) {
                        try {
                            $response = Invoke-WebRequest `
                                -Uri "http://localhost/services/health" `
                                -UseBasicParsing `
                                -TimeoutSec 15

                            if ($response.StatusCode -eq 200) {
                                $healthy = $true
                                break
                            }
                        }
                        catch {
                            Start-Sleep -Seconds 5
                        }
                    }

                    if (-not $healthy) {
                        throw "Local API health check failed: http://localhost/services/health"
                    }

                    Write-Host "STMS_PROD_DEPLOY_OK"
                    exit 0
                }
                catch {
                    [Console]::Error.WriteLine("STMS_PROD_DEPLOY_FAILED: $($_.Exception.Message)")
                    exit 1
                }
                '@

                $script = $script `
                  .Replace('__BACKEND__', $backend64) `
                  .Replace('__FRONTEND__', $frontend64) `
                  .Replace('__SQL__', $sql64) `
                  .Replace('__JWT__', $jwt64) `
                  .Replace('__GROQ__', $groq64) `
                  .Replace('__IP__', $ip64)

                $scriptPath = "$(Agent.TempDirectory)\deploy-prod.ps1"
                Set-Content -LiteralPath $scriptPath -Value $script -Encoding utf8

                $completed = $false

                for ($runAttempt = 1; $runAttempt -le 3; $runAttempt++) {
                    Write-Host "VM configuration attempt $runAttempt of 3..."

                    $scriptArgument = "@$scriptPath"

                    $runArgs = @(
                        'vm', 'run-command', 'invoke',
                        '--resource-group', '$(resourceGroup)',
                        '--name', '$(vmName)',
                        '--command-id', 'RunPowerShellScript',
                        '--scripts', $scriptArgument,
                        '--only-show-errors',
                        '--output', 'json'
                    )

                    $rawResult = & az @runArgs 2>&1
                    $runExitCode = $LASTEXITCODE
                    $resultText = $rawResult | Out-String

                    if ($runExitCode -ne 0) {
                        Write-Host $resultText
                        throw "Azure VM Run Command invocation failed with exit code $runExitCode."
                    }

                    try {
                        $result = $resultText | ConvertFrom-Json
                    }
                    catch {
                        Write-Host $resultText
                        throw 'Azure VM Run Command returned non-JSON output.'
                    }

                    $stdout = @(
                        $result.value |
                        Where-Object { $_.code -like 'ComponentStatus/StdOut/*' } |
                        ForEach-Object { $_.message }
                    ) -join "`n"

                    $stderr = @(
                        $result.value |
                        Where-Object { $_.code -like 'ComponentStatus/StdErr/*' } |
                        ForEach-Object { $_.message }
                    ) -join "`n"

                    if (-not [string]::IsNullOrWhiteSpace($stdout)) {
                        Write-Host $stdout
                    }

                    if (-not [string]::IsNullOrWhiteSpace($stderr)) {
                        Write-Warning $stderr
                    }

                    if ($stdout -match 'STMS_PROD_DEPLOY_OK') {
                        $completed = $true
                        break
                    }

                    if ($stdout -match 'STMS_REBOOT_REQUIRED') {
                        if ($runAttempt -ge 3) {
                            throw 'VM still requires a reboot after the maximum number of configuration attempts.'
                        }

                        Write-Host 'Restarting VM because an installer requested a reboot...'

                        & az vm restart `
                          --resource-group "$(resourceGroup)" `
                          --name "$(vmName)" `
                          --only-show-errors `
                          --output none

                        if ($LASTEXITCODE -ne 0) {
                            throw 'Azure VM restart failed.'
                        }

                        Start-Sleep -Seconds 30
                        continue
                    }

                    throw "Remote configuration failed. $stderr"
                }

                if (-not $completed) {
                    throw 'Production VM configuration did not complete successfully.'
                }

          - task: PowerShell@2
            displayName: Verify Production Site and API
            inputs:
              pwsh: true
              targetType: inline
              script: |
                $ErrorActionPreference = 'Stop'

                $siteUrl = "https://$(VM_PUBLIC_IP)/"
                $healthUrl = "https://$(VM_PUBLIC_IP)/services/health"

                $siteHealthy = $false
                $apiHealthy = $false

                for ($attempt = 1; $attempt -le 12; $attempt++) {
                    try {
                        $site = Invoke-WebRequest `
                          -Uri $siteUrl `
                          -SkipCertificateCheck `
                          -TimeoutSec 20

                        $health = Invoke-WebRequest `
                          -Uri $healthUrl `
                          -SkipCertificateCheck `
                          -TimeoutSec 20

                        $siteHealthy = $site.StatusCode -eq 200
                        $apiHealthy = $health.StatusCode -eq 200

                        if ($siteHealthy -and $apiHealthy) {
                            break
                        }
                    }
                    catch {
                        Write-Host "Smoke test attempt $attempt failed: $($_.Exception.Message)"
                    }

                    Start-Sleep -Seconds 10
                }

                if (-not $siteHealthy) {
                    throw "Frontend smoke test failed: $siteUrl"
                }

                if (-not $apiHealthy) {
                    throw "API health check failed: $healthUrl"
                }

                Write-Host '============================================'
                Write-Host 'PRODUCTION DEPLOYMENT SUCCESSFUL'
                Write-Host "Site: $siteUrl"
                Write-Host "Health: $healthUrl"
                Write-Host "VM size: $(DEPLOYED_VM_SIZE)"
                Write-Host '============================================'

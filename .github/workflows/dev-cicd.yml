name: Dev CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - "feature/dev/**"
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test ./Infrastructure.Tests/Infrastructure.Tests.csproj --configuration Release --no-build

      - name: Publish
        run: dotnet publish ./Api/Api.csproj --configuration Release --output ./publish --no-restore

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: publish
          path: ./publish

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    environment: Development
    needs: build

    concurrency:
      group: stms-dev-azure-resources
      cancel-in-progress: false
      
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Verify Azure Login
        run: |
          echo "Checking Azure Login ..."
          az account show --query '{tenantId: tenantId, subscriptionId: id, displayName: name}' -o table

      - name: List resource groups
        run: |
          echo "Listing all resource groups..."
          az group list --output table

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create Resource Group via Bicep
        run: |
          az deployment sub create \
            --location eastus \
            --template-file Azure/infra/rg.bicep \
            --parameters location='eastus' resourceGroupName='stms-dev-rg'

      - name: Deploy SQL Server Infrastructure via Bicep
        run: |
          az deployment group create \
            --resource-group stms-dev-rg \
            --template-file Azure/infra/sql.bicep \
            --parameters @Azure/infra/parameters/dev.json \
            --parameters sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}"

      - name: Verify SQL Server Deployment
        run: |
          echo "Listing all SQL servers in the resource group..."
          az sql server list --resource-group stms-dev-rg --output table
          echo "Listing all databases..."
          az sql db list --resource-group stms-dev-rg --server stms-dev-sql-server --output table

      - name: Get Service Principal Object ID
        id: azure_ids
        run: |
          OBJECT_ID=$(az ad sp show --id ${{ secrets.AZURE_CLIENT_ID }} --query id -o tsv)
          echo "object_id=$OBJECT_ID" >> $GITHUB_OUTPUT
          echo "Service Principal Object ID: $OBJECT_ID"

      - name: Get Key Vault Secrets Officer Role ID
        id: role_id
        run: |
          ROLE_ID=$(az role definition list --name "Key Vault Secrets Officer" --query '[0].name' -o tsv)
          echo "role_id=$ROLE_ID" >> $GITHUB_OUTPUT
          echo "Role ID: $ROLE_ID"

      - name: Deploy Key Vault via Bicep
        run: |
          az deployment group create \
            --resource-group stms-dev-rg \
            --template-file Azure/infra/keyvault.bicep \
            --parameters @Azure/infra/parameters/keyvault-dev.json \
            --parameters tenantId="${{ secrets.AZURE_TENANT_ID }}" \
            --parameters objectId="${{ steps.azure_ids.outputs.object_id }}" \
            --parameters secretsOfficerRoleId="${{ steps.role_id.outputs.role_id }}"

      - name: Store SQL Connection String in Key Vault
        run: |
          CONNECTION_STRING="Server=tcp:stms-dev-sql-server.database.windows.net,1433;Initial Catalog=stms-dev-db;Persist Security Info=False;User ID=sqladmin;Password=${{ secrets.SQL_ADMIN_PASSWORD }};MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"

          az keyvault secret set \
            --vault-name stms-dev-kv \
            --name SqlConnectionString \
            --value "$CONNECTION_STRING"

          echo "✅ SQL Connection String stored in Key Vault"

      - name: Get SQL Connection String from Key Vault
        id: get_conn
        run: |
          CONN=$(az keyvault secret show --vault-name stms-dev-kv --name SqlConnectionString --query value -o tsv)
          echo "::add-mask::$CONN"
          echo "value=$CONN" >> $GITHUB_OUTPUT

      - name: Deploy Storage Account via Bicep
        run: |
          az deployment group create \
            --resource-group stms-dev-rg \
            --template-file Azure/infra/storage.bicep \
            --parameters @Azure/infra/parameters/storage-dev.json

      - name: Download Build Artifact
        uses: actions/download-artifact@v6
        with:
          name: publish
          path: ./publish

      - name: Zip Published App
        run: |
          cd publish
          zip -r ../publish.zip .
          cd ..

      - name: Upload Artifact to Storage & Generate SAS URL
        id: upload
        run: |
          STORAGE_KEY=$(az storage account keys list --account-name stmsdevartifacts --resource-group stms-dev-rg --query '[0].value' -o tsv)
          BLOB_NAME="publish-${{ github.run_id }}.zip"

          az storage blob upload \
            --account-name stmsdevartifacts \
            --account-key "$STORAGE_KEY" \
            --container-name deployments \
            --name "$BLOB_NAME" \
            --file publish.zip \
            --overwrite

          EXPIRY=$(date -u -d "+30 minutes" '+%Y-%m-%dT%H:%MZ')
          SAS=$(az storage blob generate-sas \
            --account-name stmsdevartifacts \
            --account-key "$STORAGE_KEY" \
            --container-name deployments \
            --name "$BLOB_NAME" \
            --permissions r \
            --expiry "$EXPIRY" \
            -o tsv)

          BLOB_URL="https://stmsdevartifacts.blob.core.windows.net/deployments/${BLOB_NAME}?${SAS}"
          echo "::add-mask::$BLOB_URL"
          echo "blob_url=$BLOB_URL" >> $GITHUB_OUTPUT

      - name: Deploy VM Infrastructure via Bicep
        run: |
          az deployment group create \
            --resource-group stms-dev-rg \
            --template-file Azure/infra/vm.bicep \
            --parameters @Azure/infra/parameters/vm-dev.json \
            --parameters adminPassword="${{ secrets.VM_ADMIN_PASSWORD }}"

      - name: Get VM Public IP
        id: vm_ip
        run: |
          PIP_NAME=$(az deployment group show \
            -g stms-dev-rg \
            -n vm \
            --query properties.outputs.publicIpName.value \
            -o tsv)

          VM_IP=$(az network public-ip show \
            -g stms-dev-rg \
            -n "$PIP_NAME" \
            --query ipAddress \
            -o tsv)

          echo "ip=$VM_IP" >> "$GITHUB_OUTPUT"
          echo "VM IP: $VM_IP"

      - name: Allow VM on SQL Server Firewall
        run: |
          az sql server firewall-rule create \
            --resource-group stms-dev-rg \
            --server stms-dev-sql-server \
            --name AllowVM \
            --start-ip-address ${{ steps.vm_ip.outputs.ip }} \
            --end-ip-address ${{ steps.vm_ip.outputs.ip }}

      - name: Get Runner Public IP
        id: runner_ip
        run: |
          RUNNER_IP=$(curl -s https://ifconfig.me)
          echo "ip=$RUNNER_IP" >> $GITHUB_OUTPUT

      - name: Allow Runner IP on SQL Server Firewall (temporary)
        run: |
          az sql server firewall-rule create \
            --resource-group stms-dev-rg \
            --server stms-dev-sql-server \
            --name GitHubRunnerTemp \
            --start-ip-address ${{ steps.runner_ip.outputs.ip }} \
            --end-ip-address ${{ steps.runner_ip.outputs.ip }}

      - name: Setup .NET for EF Migrations
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run EF Core Migrations
        env:
          ConnectionStrings__DefaultConnection: ${{ steps.get_conn.outputs.value }}
        run: |
          dotnet restore
          dotnet tool install --global dotnet-ef --version 10.0.11
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update --project Infrastructure --startup-project Api

      - name: Remove Temporary Runner Firewall Rule
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group stms-dev-rg \
            --server stms-dev-sql-server \
            --name GitHubRunnerTemp \
            --yes || true

      - name: Deploy App to VM via Run Command
        run: |
          BLOB_URL="${{ steps.upload.outputs.blob_url }}"
          CONN_STR="${{ steps.get_conn.outputs.value }}"

          az vm run-command invoke \
            --resource-group stms-dev-rg \
            --name stms-dev-vm \
            --command-id RunShellScript \
            --scripts \
              "apt-get update && apt-get install -y unzip curl" \
              "systemctl stop stms-api || true" \
              "rm -rf /var/www/stms-api/*" \
              "curl -sSL '$BLOB_URL' -o /tmp/publish.zip" \
              "unzip -o /tmp/publish.zip -d /var/www/stms-api" \
              "echo 'ASPNETCORE_ENVIRONMENT=Production' > /etc/stms-api.env" \
              "echo 'ASPNETCORE_URLS=http://127.0.0.1:5000' >> /etc/stms-api.env" \
              "echo 'ConnectionStrings__DefaultConnection=$CONN_STR' >> /etc/stms-api.env" \
              "chown -R www-data:www-data /var/www/stms-api /etc/stms-api.env" \
              "systemctl daemon-reload" \
              "systemctl restart stms-api"

      - name: Setup Node for Frontend Build
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/Angular/package-lock.json

      - name: Build Frontend
        working-directory: Frontend/Angular
        run: |
          npm ci
          npm run build:prod

      - name: Zip Frontend Build
        working-directory: Frontend/Angular/dist/smart-task-management-system/browser
        run: |
          test -f index.html
          zip -qr "$GITHUB_WORKSPACE/frontend-build.zip" .

      - name: Upload Frontend Build to Storage & Generate SAS URL
        id: upload_frontend
        shell: bash
        run: |
          set -euo pipefail

          STORAGE_KEY=$(az storage account keys list \
            --account-name stmsdevartifacts \
            --resource-group stms-dev-rg \
            --query '[0].value' -o tsv)
          echo "::add-mask::$STORAGE_KEY"

          BLOB_NAME="frontend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"

          az storage blob upload \
            --account-name stmsdevartifacts \
            --account-key "$STORAGE_KEY" \
            --container-name deployments \
            --name "$BLOB_NAME" \
            --file "$GITHUB_WORKSPACE/frontend-build.zip" \
            --overwrite \
            --only-show-errors \
            --output none

          EXPIRY=$(date -u -d "+30 minutes" '+%Y-%m-%dT%H:%MZ')

          SAS=$(az storage blob generate-sas \
            --account-name stmsdevartifacts \
            --account-key "$STORAGE_KEY" \
            --container-name deployments \
            --name "$BLOB_NAME" \
            --permissions r \
            --https-only \
            --expiry "$EXPIRY" \
            -o tsv)
          echo "::add-mask::$SAS"

          BLOB_URL="https://stmsdevartifacts.blob.core.windows.net/deployments/${BLOB_NAME}?${SAS}"
          echo "::add-mask::$BLOB_URL"
          echo "frontend_blob_url=$BLOB_URL" >> "$GITHUB_OUTPUT"

      - name: Deploy Frontend to Nginx with Self-Signed HTTPS
        shell: bash
        env:
          VM_IP: ${{ steps.vm_ip.outputs.ip }}
          FRONTEND_BLOB_URL: ${{ steps.upload_frontend.outputs.frontend_blob_url }}
        run: |
          set -euo pipefail
          test -n "$VM_IP"
          test -n "$FRONTEND_BLOB_URL"

          # Quoted heredocs preserve shell and Nginx variables.
          cat > deploy-frontend.sh <<'REMOTE_SCRIPT'
          #!/bin/sh
          set -eu

          VM_IP="$1"
          FRONTEND_BLOB_URL="$2"

          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y openssl nginx curl unzip ca-certificates

          mkdir -p /var/www/stms-web \
            /etc/nginx/ssl \
            /etc/nginx/sites-available \
            /etc/nginx/sites-enabled

          # Download and validate before replacing the deployed files.
          WORK_DIR=$(mktemp -d)
          trap 'rm -rf "$WORK_DIR"' EXIT

          curl --fail --silent --show-error --location \
            --retry 3 "$FRONTEND_BLOB_URL" \
            -o "$WORK_DIR/frontend-build.zip"

          unzip -q "$WORK_DIR/frontend-build.zip" -d "$WORK_DIR/site"
          test -f "$WORK_DIR/site/index.html"

          # Reuse the certificate unless missing, expiring within
          # 30 days, or issued for a different IP.
          if [ ! -s /etc/nginx/ssl/stms.key ] ||
             [ ! -s /etc/nginx/ssl/stms.crt ] ||
             ! openssl x509 -in /etc/nginx/ssl/stms.crt \
                 -checkend 2592000 -noout >/dev/null 2>&1 ||
             ! openssl x509 -in /etc/nginx/ssl/stms.crt \
                 -checkip "$VM_IP" -noout >/dev/null 2>&1; then
            (
              umask 077
              openssl req -x509 -nodes -newkey rsa:2048 -sha256 \
                -keyout /etc/nginx/ssl/stms.key \
                -out /etc/nginx/ssl/stms.crt \
                -days 365 \
                -subj "/CN=$VM_IP" \
                -addext "subjectAltName=IP:$VM_IP"
            )
          fi

          chown root:root /etc/nginx/ssl/stms.key /etc/nginx/ssl/stms.crt
          chmod 600 /etc/nginx/ssl/stms.key
          chmod 644 /etc/nginx/ssl/stms.crt

          cat > "$WORK_DIR/stms.conf" <<'NGINX_CONFIG'
          server {
              listen 80;
              server_name __VM_IP__;
              return 301 https://__VM_IP__$request_uri;
          }

          server {
              listen 443 ssl;
              server_name __VM_IP__;

              root /var/www/stms-web;
              index index.html;

              ssl_certificate /etc/nginx/ssl/stms.crt;
              ssl_certificate_key /etc/nginx/ssl/stms.key;
              ssl_protocols TLSv1.2 TLSv1.3;

              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;

              location /api/ {
                  proxy_pass http://127.0.0.1:5000;
              }

              location = /health {
                  proxy_pass http://127.0.0.1:5000;
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
          NGINX_CONFIG

          sed "s/__VM_IP__/$VM_IP/g" "$WORK_DIR/stms.conf" \
            > /etc/nginx/sites-available/stms

          ln -sf /etc/nginx/sites-available/stms /etc/nginx/sites-enabled/stms
          rm -f /etc/nginx/sites-enabled/default
          nginx -t

          # Clear old files, including hidden files.
          find /var/www/stms-web -mindepth 1 -maxdepth 1 \
            -exec rm -rf -- {} +
          cp -a "$WORK_DIR/site/." /var/www/stms-web/
          chown -R www-data:www-data /var/www/stms-web
          find /var/www/stms-web -type d -exec chmod 755 {} +
          find /var/www/stms-web -type f -exec chmod 644 {} +

          systemctl enable nginx
          systemctl restart nginx

          # Validate HTTPS locally using the actual certificate.
          curl --fail --silent --show-error \
            --cacert /etc/nginx/ssl/stms.crt \
            --resolve "$VM_IP:443:127.0.0.1" \
            "https://$VM_IP/" -o /dev/null

          echo "STMS_FRONTEND_DEPLOY_OK"
          REMOTE_SCRIPT

          # Encode the values so the SAS URL cannot interfere with shell syntax.
          VM_IP_BASE64=$(printf '%s' "$VM_IP" | base64 -w0)
          BLOB_URL_BASE64=$(printf '%s' "$FRONTEND_BLOB_URL" | base64 -w0)
          echo "::add-mask::$BLOB_URL_BASE64"

          # Supply $1 and $2 inside the script, bypassing Azure parameter parsing.
          {
            printf '#!/bin/sh\n'
            printf 'set -- "$(printf %%s "%s" | base64 --decode)" "$(printf %%s "%s" | base64 --decode)"\n' \
              "$VM_IP_BASE64" "$BLOB_URL_BASE64"
            cat deploy-frontend.sh
          } > deploy-frontend-invoke.sh

          az vm run-command invoke \
            --resource-group stms-dev-rg \
            --name stms-dev-vm \
            --command-id RunShellScript \
            --scripts @deploy-frontend-invoke.sh \
            --output json > frontend-deploy-result.json

          # Check script completion as well as the Azure CLI exit code.
          if ! jq -e \
            'any(.value[]?; (.message // "") | contains("STMS_FRONTEND_DEPLOY_OK"))' \
            frontend-deploy-result.json > /dev/null; then
            cat frontend-deploy-result.json
            echo "::error::Frontend deployment failed on the VM."
            exit 1
          fi

      - name: Smoke Test Frontend and API over HTTPS
        shell: bash
        env:
          VM_IP: ${{ steps.vm_ip.outputs.ip }}
        run: |
          set -euo pipefail

          # -k is needed here because the runner does not trust
          # the VM's self-signed certificate.
          for i in $(seq 1 10); do
            if curl -fkSs --connect-timeout 10 --max-time 20 \
                 "https://$VM_IP/" -o /dev/null &&
               curl -fkSs --connect-timeout 10 --max-time 20 \
                 "https://$VM_IP/health" -o /dev/null; then
              echo "Frontend and API checks passed: https://$VM_IP"
              exit 0
            fi

            echo "Waiting for frontend/API... ($i/10)"
            sleep 10
          done

          echo "::error::HTTPS smoke checks failed."
          exit 1

      - name: Show Deployed Site URL
        env:
          VM_IP: ${{ steps.vm_ip.outputs.ip }}
        run: |
          echo "Site URL: https://$VM_IP"
          echo "### Deployed Site" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open site](https://$VM_IP)" >> "$GITHUB_STEP_SUMMARY"          
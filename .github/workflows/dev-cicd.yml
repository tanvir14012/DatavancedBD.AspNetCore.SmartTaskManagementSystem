name: STMS Dev CD

on:
  push:
    branches: [saas, main, master]
  workflow_dispatch:
    inputs:
      rollback_revision:
        description: Explicit Helm revision to restore; empty builds and deploys
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: stms-dev
  cancel-in-progress: false

jobs:
  validate:
    if: inputs.rollback_revision == '' && contains(fromJSON('["saas","main","master"]'), github.ref_name)
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: stms-dev
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_BUILD_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "$ACR_NAME"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: bash deploy/aks/build-images.sh
      - name: Capture immutable release manifest
        run: |
          registry="$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)"
          export registry
          python - <<'PY'
          import json, os, subprocess
          images = {name: subprocess.check_output(['az', 'acr', 'manifest', 'show', '--registry', os.environ['ACR_NAME'], '--name', f'stms-{name}:' + os.environ['IMAGE_TAG'], '--query', 'digest', '-o', 'tsv'], text=True).strip() for name in ('api', 'admin', 'worker', 'frontend')}
          with open('release.json', 'w') as output:
              json.dump({'source': os.environ['GITHUB_SHA'], 'registry': os.environ['registry'], 'images': images}, output)
          PY
          python deploy/aks/release-manifest.py release.json "$registry" "$GITHUB_SHA" > "$RUNNER_TEMP/images.txt"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign captured digests
        run: |
          registry="$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)"
          while IFS='=' read -r image digest; do
            cosign sign --yes "$registry/stms-$image@$digest"
          done < "$RUNNER_TEMP/images.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest
          path: release.json
          if-no-files-found: error
          retention-days: 90

  scan:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: stms-dev
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, admin, worker, frontend]
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "$ACR_NAME"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-manifest
      - id: image
        run: |
          python - <<'PY'
          import json, os
          with open('release.json') as source:
              release = json.load(source)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"ref={release['registry']}/stms-{os.environ['IMAGE']}@{release['images'][os.environ['IMAGE']]}\n")
          PY
      - uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

  deploy:
    needs: [build, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: stms-dev
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
      NAMESPACE: ${{ vars.NAMESPACE }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
      RUNTIME_CLIENT_ID: ${{ vars.RUNTIME_CLIENT_ID }}
      ADMIN_CLIENT_ID: ${{ vars.ADMIN_CLIENT_ID }}
      INGRESS_HOST: ${{ vars.INGRESS_HOST }}
      ENVIRONMENT: dev
      CERT_ISSUER_NAME: letsencrypt-staging
      RELEASE_MANIFEST: release.json
      RELEASE_SOURCE: ${{ github.sha }}
      SOURCE_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Use isolated cluster credentials
        run: echo "KUBECONFIG=$RUNNER_TEMP/stms-kubeconfig" >> "$GITHUB_ENV"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.34.1
      - uses: azure/use-kubelogin@76597ae0fcbaace21b05e13a2cbf8daee2c6e820 # v1
        with:
          kubelogin-version: v0.2.12
      - run: az acr login --name "$ACR_NAME"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-manifest
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Verify the exact digests to be deployed
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          registry="$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)"
          python deploy/aks/release-manifest.py release.json "$registry" "$RELEASE_SOURCE" > "$RUNNER_TEMP/images.txt"
          while IFS='=' read -r image digest; do
            cosign verify --certificate-identity "https://github.com/$REPOSITORY/.github/workflows/dev-cicd.yml@refs/heads/$SOURCE_BRANCH" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$registry/stms-$image@$digest" > /dev/null
          done < "$RUNNER_TEMP/images.txt"
      - run: bash deploy/aks/deploy-release.sh
      - name: Remove local cluster credentials
        if: always()
        run: rm -f "$KUBECONFIG"

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_revision != '' && contains(fromJSON('["saas","main","master"]'), github.ref_name)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stms-dev
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
      NAMESPACE: ${{ vars.NAMESPACE }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
      RUNTIME_CLIENT_ID: ${{ vars.RUNTIME_CLIENT_ID }}
      ADMIN_CLIENT_ID: ${{ vars.ADMIN_CLIENT_ID }}
      INGRESS_HOST: ${{ vars.INGRESS_HOST }}
      ROLLBACK_REVISION: ${{ inputs.rollback_revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Use isolated cluster credentials
        run: echo "KUBECONFIG=$RUNNER_TEMP/stms-kubeconfig" >> "$GITHUB_ENV"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.34.1
      - uses: azure/use-kubelogin@76597ae0fcbaace21b05e13a2cbf8daee2c6e820 # v1
        with:
          kubelogin-version: v0.2.12
      - run: bash deploy/aks/rollback-release.sh
      - name: Remove local cluster credentials
        if: always()
        run: rm -f "$KUBECONFIG"

name: Dev CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - "feature/dev/**"
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

  AZURE_LOCATION: southeastasia
  RESOURCE_GROUP: stms-dev-rg
  VM_NAME: stms-dev-vm
  SQL_SERVER: stms-dev-sql-server
  SQL_DATABASE: stms-dev-db
  KEY_VAULT: stms-dev-kv
  STORAGE_ACCOUNT: stmsdevartifacts
  STORAGE_CONTAINER: deployments

jobs:
  backend:
    name: Build and Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate App Settings
        run: jq empty Api/appsettings.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/NuGet.Config', '**/nuget.config', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore, Build and Test
        run: |
          set -euo pipefail

          dotnet restore
          dotnet build --configuration Release --no-restore

          dotnet test \
            ./Infrastructure.Tests/Infrastructure.Tests.csproj \
            --configuration Release \
            --no-build \
            --no-restore

      - name: Publish and Package
        run: |
          set -euo pipefail

          dotnet publish ./Api/Api.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            --output ./publish

          (
            cd publish
            zip -qr "$GITHUB_WORKSPACE/publish.zip" .
          )

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v6
        with:
          name: backend
          path: publish.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/Angular/package-lock.json

      - name: Install and Build
        working-directory: Frontend/Angular
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:prod

      - name: Package Frontend
        working-directory: Frontend/Angular/dist/smart-task-management-system/browser
        run: |
          set -euo pipefail
          test -f index.html
          zip -qr "$GITHUB_WORKSPACE/frontend-build.zip" .

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend
          path: frontend-build.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  deploy:
    name: Deploy to Azure
    if: github.event_name != 'pull_request'
    needs:
      - backend
      - frontend

    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Development

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: stms-dev-azure-resources
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate Deployment Configuration
        env:
          JWT_KEY: ${{ secrets.JWT_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          jq empty Api/appsettings.json

          : "${JWT_KEY:?Missing JWT_KEY}"
          : "${GROQ_API_KEY:?Missing GROQ_API_KEY}"
          : "${SQL_ADMIN_PASSWORD:?Missing SQL_ADMIN_PASSWORD}"
          : "${VM_ADMIN_PASSWORD:?Missing VM_ADMIN_PASSWORD}"

          KEY_BYTES=$(printf '%s' "$JWT_KEY" | wc -c)
          if (( KEY_BYTES < 32 )); then
            echo "::error::JWT_KEY must contain at least 32 bytes for HS256."
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download Backend
        uses: actions/download-artifact@v6
        with:
          name: backend
          path: artifacts

      - name: Download Frontend
        uses: actions/download-artifact@v6
        with:
          name: frontend
          path: artifacts

      - name: Deploy Infrastructure
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          # Explicit regional name avoids deployment-history location conflicts.
          az deployment sub create \
            --name "stms-dev-rg-$AZURE_LOCATION" \
            --location "$AZURE_LOCATION" \
            --template-file Azure/infra/rg.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              resourceGroupName="$RESOURCE_GROUP" \
            --only-show-errors \
            --output none

          az deployment group create \
            --name sql \
            --resource-group "$RESOURCE_GROUP" \
            --template-file Azure/infra/sql.bicep \
            --parameters @Azure/infra/parameters/dev.json \
            --parameters sqlAdminPassword="$SQL_ADMIN_PASSWORD" \
            --only-show-errors \
            --output none

          OBJECT_ID=$(az ad sp show \
            --id "$AZURE_CLIENT_ID" \
            --query id -o tsv)

          ROLE_ID=$(az role definition list \
            --name "Key Vault Secrets Officer" \
            --query '[0].name' -o tsv)

          test -n "$OBJECT_ID"
          test -n "$ROLE_ID"

          az deployment group create \
            --name keyvault \
            --resource-group "$RESOURCE_GROUP" \
            --template-file Azure/infra/keyvault.bicep \
            --parameters @Azure/infra/parameters/keyvault-dev.json \
            --parameters \
              tenantId="$AZURE_TENANT_ID" \
              objectId="$OBJECT_ID" \
              secretsOfficerRoleId="$ROLE_ID" \
            --only-show-errors \
            --output none

          az deployment group create \
            --name storage \
            --resource-group "$RESOURCE_GROUP" \
            --template-file Azure/infra/storage.bicep \
            --parameters @Azure/infra/parameters/storage-dev.json \
            --only-show-errors \
            --output none

          az deployment group create \
            --name vm \
            --resource-group "$RESOURCE_GROUP" \
            --template-file Azure/infra/vm.bicep \
            --parameters @Azure/infra/parameters/vm-dev.json \
            --parameters adminPassword="$VM_ADMIN_PASSWORD" \
            --only-show-errors \
            --output none

      - name: Store and Read SQL Connection String
        id: get_conn
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          # Quote the password for SQL connection-string syntax.
          SQL_PASSWORD_ESCAPED=${SQL_ADMIN_PASSWORD//\"/\"\"}
          CONNECTION_STRING="Server=tcp:$SQL_SERVER.database.windows.net,1433;Initial Catalog=$SQL_DATABASE;Persist Security Info=False;User ID=sqladmin;Password=\"$SQL_PASSWORD_ESCAPED\";MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"

          echo "::add-mask::$CONNECTION_STRING"

          # New Key Vault role assignments can take time to propagate.
          STORED=false
          for attempt in $(seq 1 12); do
            if az keyvault secret set \
              --vault-name "$KEY_VAULT" \
              --name SqlConnectionString \
              --value "$CONNECTION_STRING" \
              --only-show-errors \
              --output none; then
              STORED=true
              break
            fi
            sleep 10
          done

          if [[ "$STORED" != true ]]; then
            echo "::error::Could not store SQL connection string."
            exit 1
          fi

          CONN=$(az keyvault secret show \
            --vault-name "$KEY_VAULT" \
            --name SqlConnectionString \
            --query value -o tsv)

          echo "::add-mask::$CONN"
          echo "value=$CONN" >> "$GITHUB_OUTPUT"

      - name: Get VM IP and Configure SQL Firewall
        id: vm_ip
        run: |
          set -euo pipefail

          PIP_NAME=$(az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name vm \
            --query properties.outputs.publicIpName.value \
            -o tsv)

          VM_IP=$(az network public-ip show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$PIP_NAME" \
            --query ipAddress -o tsv)

          test -n "$VM_IP"
          echo "ip=$VM_IP" >> "$GITHUB_OUTPUT"

          az sql server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --server "$SQL_SERVER" \
            --name AllowVM \
            --start-ip-address "$VM_IP" \
            --end-ip-address "$VM_IP" \
            --only-show-errors \
            --output none

      - name: Setup .NET for Migrations
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet Cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/NuGet.Config', '**/nuget.config', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Prepare EF Migrations
        run: |
          set -euo pipefail

          dotnet restore
          dotnet tool install \
            --tool-path "$RUNNER_TEMP/ef-tools" \
            dotnet-ef \
            --version 10.0.11

      - name: Allow Runner on SQL Firewall
        id: runner_firewall
        run: |
          set -euo pipefail

          RUNNER_IP=$(curl -4fsS --retry 3 https://api.ipify.org)
          RULE_NAME="GitHubRunner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          # Save the name before creation so cleanup can run after partial failure.
          echo "rule_name=$RULE_NAME" >> "$GITHUB_OUTPUT"

          az sql server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --server "$SQL_SERVER" \
            --name "$RULE_NAME" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP" \
            --only-show-errors \
            --output none

      - name: Run EF Core Migrations
        env:
          ConnectionStrings__DefaultConnection: ${{ steps.get_conn.outputs.value }}
        run: |
          set -euo pipefail

          "$RUNNER_TEMP/ef-tools/dotnet-ef" database update \
            --project Infrastructure \
            --startup-project Api

      - name: Remove Runner SQL Firewall Rule
        if: always() && steps.runner_firewall.outputs.rule_name != ''
        env:
          RULE_NAME: ${{ steps.runner_firewall.outputs.rule_name }}
        run: |
          az sql server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" \
            --server "$SQL_SERVER" \
            --name "$RULE_NAME" \
            --yes \
            --only-show-errors \
            --output none

      - name: Generate API Environment File
        env:
          DB_CONNECTION: ${{ steps.get_conn.outputs.value }}
          VM_IP: ${{ steps.vm_ip.outputs.ip }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          umask 077

          : "${DB_CONNECTION:?Missing DB_CONNECTION}"
          : "${VM_IP:?Missing VM_IP}"

          {
            printf '%s\n' \
              'ASPNETCORE_ENVIRONMENT="Production"' \
              'ASPNETCORE_URLS="http://127.0.0.1:5000"'

            jq -r '
              .ConnectionStrings.DefaultConnection = env.DB_CONNECTION
              | .Cors.AllowedOrigins = [
                  ("https://" + env.VM_IP),
                  ("http://" + env.VM_IP)
                ]
              | .Jwt.Issuer = ("https://" + env.VM_IP)
              | .Jwt.Audience = ("https://" + env.VM_IP)
              | .Jwt.Key = env.JWT_KEY
              | .Ai.GroqApiKey = env.GROQ_API_KEY
              | del(.Logging.LogLevel["Microsoft.AspNetCore"])
              | . as $config
              | paths(scalars) as $path
              | ($config | getpath($path)) as $value
              | select($value != null)
              | ($path | map(tostring) | join("__")) as $key
              | if ($key | test("^[A-Za-z_][A-Za-z0-9_]*$") | not) then
                  error("Invalid environment key: " + $key)
                else
                  ($value | tostring) as $text
                  | if ($text | test("[\r\n\u0000]")) then
                      error("Unsupported environment value: " + $key)
                    else
                      ($text
                        | gsub("\\\\"; "\\\\")
                        | gsub("\""; "\\\"")
                      ) as $escaped
                      | $key + "=\"" + $escaped + "\""
                    end
                end
            ' Api/appsettings.json
          } > "$RUNNER_TEMP/stms-api.env"

      - name: Upload Deployment Packages
        id: packages
        run: |
          set -euo pipefail

          STORAGE_KEY=$(az storage account keys list \
            --account-name "$STORAGE_ACCOUNT" \
            --resource-group "$RESOURCE_GROUP" \
            --query '[0].value' -o tsv)

          echo "::add-mask::$STORAGE_KEY"

          # Avoid passing account keys repeatedly as command arguments.
          export AZURE_STORAGE_ACCOUNT="$STORAGE_ACCOUNT"
          export AZURE_STORAGE_KEY="$STORAGE_KEY"

          upload_package() {
            local file="$1"
            local prefix="$2"
            local output_name="$3"
            local blob expiry sas url

            blob="${prefix}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"

            az storage blob upload \
              --container-name "$STORAGE_CONTAINER" \
              --name "$blob" \
              --file "$file" \
              --overwrite \
              --only-show-errors \
              --output none

            expiry=$(date -u -d '+30 minutes' '+%Y-%m-%dT%H:%MZ')

            sas=$(az storage blob generate-sas \
              --container-name "$STORAGE_CONTAINER" \
              --name "$blob" \
              --permissions r \
              --https-only \
              --expiry "$expiry" \
              -o tsv)

            echo "::add-mask::$sas"
            url="https://${STORAGE_ACCOUNT}.blob.core.windows.net/${STORAGE_CONTAINER}/${blob}?${sas}"
            echo "::add-mask::$url"
            echo "${output_name}=$url" >> "$GITHUB_OUTPUT"
          }

          upload_package artifacts/publish.zip publish api_url
          upload_package artifacts/frontend-build.zip frontend frontend_url

      - name: Deploy API and Frontend to VM
        env:
          VM_IP: ${{ steps.vm_ip.outputs.ip }}
          API_URL: ${{ steps.packages.outputs.api_url }}
          FRONTEND_URL: ${{ steps.packages.outputs.frontend_url }}
        run: |
          set -euo pipefail
          umask 077

          ENV_FILE="$RUNNER_TEMP/stms-api.env"
          SCRIPT_FILE="$RUNNER_TEMP/deploy-stms.sh"
          RESULT_FILE="$RUNNER_TEMP/deploy-stms-result.json"

          trap 'rm -f "$ENV_FILE" "$SCRIPT_FILE" "$RESULT_FILE"' EXIT
          test -s "$ENV_FILE"

          # Encode values to avoid shell quoting and Run Command parameter issues.
          {
            printf '#!/bin/sh\nset -eu\numask 077\n'

            for name in VM_IP API_URL FRONTEND_URL; do
              encoded=$(printf '%s' "${!name}" | base64 -w0)
              echo "::add-mask::$encoded" >&2
              printf '%s=$(printf %%s "%s" | base64 --decode)\n' \
                "$name" "$encoded"
            done

            encoded=$(base64 -w0 "$ENV_FILE")
            echo "::add-mask::$encoded" >&2
            printf "ENV_BASE64='%s'\n" "$encoded"

            cat <<'REMOTE_SCRIPT'
          # Provision missing tools only; avoid apt work on routine deployments.
          MISSING=false
          for tool in curl unzip openssl nginx; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              MISSING=true
            fi
          done

          if [ "$MISSING" = true ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y curl unzip openssl nginx ca-certificates
          fi

          WORK_DIR=$(mktemp -d)
          trap 'rm -rf "$WORK_DIR"' EXIT

          # Stage both packages before interrupting either application.
          curl -fsSL --retry 3 "$API_URL" -o "$WORK_DIR/api.zip"
          curl -fsSL --retry 3 "$FRONTEND_URL" -o "$WORK_DIR/frontend.zip"

          unzip -q "$WORK_DIR/api.zip" -d "$WORK_DIR/api"
          unzip -q "$WORK_DIR/frontend.zip" -d "$WORK_DIR/frontend"

          test -f "$WORK_DIR/api/Api.dll"
          test -f "$WORK_DIR/frontend/index.html"

          printf '%s' "$ENV_BASE64" | base64 --decode \
            > "$WORK_DIR/stms-api.env"

          # nginx must be able to traverse its configuration directories.
          install -d -m 755 \
            /etc/nginx/ssl \
            /etc/nginx/sites-available \
            /etc/nginx/sites-enabled \
            /var/www/stms-api \
            /var/www/stms-web

          if [ ! -s /etc/nginx/ssl/stms.key ] ||
             [ ! -s /etc/nginx/ssl/stms.crt ] ||
             ! openssl x509 -in /etc/nginx/ssl/stms.crt \
               -checkend 2592000 -noout >/dev/null 2>&1 ||
             ! openssl x509 -in /etc/nginx/ssl/stms.crt \
               -checkip "$VM_IP" -noout >/dev/null 2>&1; then
            openssl req -x509 -nodes -newkey rsa:2048 -sha256 \
              -keyout /etc/nginx/ssl/stms.key \
              -out /etc/nginx/ssl/stms.crt \
              -days 365 \
              -subj "/CN=$VM_IP" \
              -addext "subjectAltName=IP:$VM_IP"
          fi

          chown root:root /etc/nginx/ssl/stms.key /etc/nginx/ssl/stms.crt
          chmod 600 /etc/nginx/ssl/stms.key
          chmod 644 /etc/nginx/ssl/stms.crt

          cat > "$WORK_DIR/nginx.conf" <<'NGINX_CONFIG'
          server {
              listen 80;
              server_name __VM_IP__;
              return 301 https://__VM_IP__$request_uri;
          }

          server {
              listen 443 ssl;
              server_name __VM_IP__;

              root /var/www/stms-web;
              index index.html;

              ssl_certificate /etc/nginx/ssl/stms.crt;
              ssl_certificate_key /etc/nginx/ssl/stms.key;
              ssl_protocols TLSv1.2 TLSv1.3;

              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;

              location /api/ {
                  proxy_pass http://127.0.0.1:5000;
              }

              location = /health {
                  proxy_pass http://127.0.0.1:5000;
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
          NGINX_CONFIG

          sed "s/__VM_IP__/$VM_IP/g" "$WORK_DIR/nginx.conf" \
            > /etc/nginx/sites-available/stms
          chmod 644 /etc/nginx/sites-available/stms

          ln -sf /etc/nginx/sites-available/stms /etc/nginx/sites-enabled/stms
          rm -f /etc/nginx/sites-enabled/default
          nginx -t

          systemctl stop stms-api

          find /var/www/stms-api -mindepth 1 -maxdepth 1 \
            -exec rm -rf -- {} +
          cp -a "$WORK_DIR/api/." /var/www/stms-api/
          chown -R www-data:www-data /var/www/stms-api

          install -o root -g root -m 600 \
            "$WORK_DIR/stms-api.env" /etc/stms-api.env

          find /var/www/stms-web -mindepth 1 -maxdepth 1 \
            -exec rm -rf -- {} +
          cp -a "$WORK_DIR/frontend/." /var/www/stms-web/
          chown -R www-data:www-data /var/www/stms-web
          find /var/www/stms-web -type d -exec chmod 755 {} +
          find /var/www/stms-web -type f -exec chmod 644 {} +

          systemctl daemon-reload
          systemctl restart stms-api
          systemctl enable nginx

          if systemctl is-active --quiet nginx; then
            systemctl reload nginx
          else
            systemctl start nginx
          fi

          for attempt in $(seq 1 15); do
            if curl -fsS --max-time 10 \
                 http://127.0.0.1:5000/health -o /dev/null &&
               curl -fsS --max-time 10 \
                 --cacert /etc/nginx/ssl/stms.crt \
                 --resolve "$VM_IP:443:127.0.0.1" \
                 "https://$VM_IP/" -o /dev/null; then
              echo "STMS_DEPLOY_OK"
              exit 0
            fi
            sleep 10
          done

          echo "Application health checks failed." >&2
          exit 1
          REMOTE_SCRIPT
          } > "$SCRIPT_FILE"

          az vm run-command invoke \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts @"$SCRIPT_FILE" \
            --output json > "$RESULT_FILE"

          if ! jq -e \
            'any(.value[]?; (.message // "") | contains("STMS_DEPLOY_OK"))' \
            "$RESULT_FILE" > /dev/null; then
            cat "$RESULT_FILE"
            echo "::error::VM deployment failed."
            exit 1
          fi

      - name: Smoke Test and Publish Site URL
        env:
          VM_IP: ${{ steps.vm_ip.outputs.ip }}
        run: |
          set -euo pipefail

          # The runner does not trust the VM self-signed certificate.
          for attempt in $(seq 1 10); do
            if curl -fkSs --connect-timeout 10 --max-time 20 \
                 "https://$VM_IP/" -o /dev/null &&
               curl -fkSs --connect-timeout 10 --max-time 20 \
                 "https://$VM_IP/health" -o /dev/null; then
              echo "Deployment verified: https://$VM_IP"

              {
                echo "### Deployed Site"
                echo
                echo "[Open site](https://$VM_IP)"
              } >> "$GITHUB_STEP_SUMMARY"

              exit 0
            fi
            sleep 10
          done

          echo "::error::Public HTTPS health checks failed."
          exit 1

      - name: Remove Temporary Deployment Files
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/stms-api.env" \
            "$RUNNER_TEMP/deploy-stms.sh" \
            "$RUNNER_TEMP/deploy-stms-result.json"
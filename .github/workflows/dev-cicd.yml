name: Dev CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - "feature/dev/**"
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test ./Infrastructure.Tests/Infrastructure.Tests.csproj --configuration Release --no-build

      - name: Publish
        run: dotnet publish ./Api/Api.csproj --configuration Release --output ./publish --no-restore

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: ./publish

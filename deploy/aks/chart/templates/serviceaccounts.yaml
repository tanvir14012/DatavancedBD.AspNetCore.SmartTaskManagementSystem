apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stms.fullname" . }}-api
  labels:
    {{- include "stms.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.runtimeClientId | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stms.fullname" . }}-admin
  labels:
    {{- include "stms.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.adminClientId | quote }}
{{- if .Values.worker.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stms.fullname" . }}-worker
  labels:
    {{- include "stms.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.runtimeClientId | quote }}
{{- end }}

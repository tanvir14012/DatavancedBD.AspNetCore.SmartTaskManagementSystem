{{- if .Values.admin.migrationEnabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "stms.fullname" . }}-admin-{{ .Release.Revision }}
  labels:
    {{- include "stms.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  backoffLimit: {{ .Values.admin.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.admin.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "stms.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: admin
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ include "stms.fullname" . }}-admin
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      nodeSelector:
        workload.stms/type: application
        {{- with .Values.nodeSelector }}{{ toYaml . | nindent 8 }}{{- end }}
      containers:
        - name: admin
          image: {{ include "stms.image" .Values.images.admin | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["migrate"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "stms.fullname" . }}-admin-secrets
            - configMapRef:
                name: {{ include "stms.fullname" . }}-config
          volumeMounts:
            {{- include "stms.secretMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        {{- include "stms.adminSecretVolume" . | nindent 8 }}
{{- end }}

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "stms.fullname" . }}-secret-sync-runtime-{{ .Release.Revision }}
  labels:
    {{- include "stms.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-sync
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "stms.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: secret-sync
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ include "stms.fullname" . }}-api
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: sync
          image: {{ include "stms.image" .Values.images.api | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args: ["test -s /mnt/secrets/ConnectionStrings__DefaultConnection && sleep 2"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "stms.secretMount" . | nindent 12 }}
      volumes:
        {{- include "stms.runtimeSecretVolume" . | nindent 8 }}
---
{{- if .Values.admin.migrationEnabled }}
apiVersion: batch/v1
kind: Job
metadata:

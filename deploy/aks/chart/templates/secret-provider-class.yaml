apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "stms.fullname" . }}-runtime
  labels:
    {{- include "stms.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ required "workloadIdentity.runtimeClientId is required" .Values.workloadIdentity.runtimeClientId | quote }}
    keyvaultName: {{ required "keyVault.name is required" .Values.keyVault.name | quote }}
    tenantId: {{ required "workloadIdentity.tenantId is required" .Values.workloadIdentity.tenantId | quote }}
    cloudName: AzurePublicCloud
    objects: |
      array:
        - |
          objectName: DefaultConnection
          objectType: secret
          objectAlias: ConnectionStrings__DefaultConnection
        - |
          objectName: JwtIssuer
          objectType: secret
          objectAlias: Jwt__Issuer
        - |
          objectName: JwtAudience
          objectType: secret
          objectAlias: Jwt__Audience
        - |
          objectName: JwtKey
          objectType: secret
          objectAlias: Jwt__Key
        - |
          objectName: GroqApiKey
          objectType: secret
          objectAlias: Ai__GroqApiKey
        - |
          objectName: RedisConnection
          objectType: secret
          objectAlias: Caching__Redis__ConnectionString
        - |
          objectName: TenantCatalogSqlConnection
          objectType: secret
          objectAlias: Saas__TenantCatalog__Sql__ConnectionString
        - |
          objectName: TenantCatalogRedisConnection
          objectType: secret
          objectAlias: Saas__TenantCatalog__Redis__ConnectionString
        - |
          objectName: StorageTargetSharedConnection
          objectType: secret
          objectAlias: Saas__Storage__Targets__shared__ConnectionString
  secretObjects:
    - secretName: {{ include "stms.fullname" . }}-runtime-secrets
      type: Opaque
      data:
        - objectName: ConnectionStrings__DefaultConnection
          key: ConnectionStrings__DefaultConnection
        - objectName: Jwt__Issuer
          key: Jwt__Issuer
        - objectName: Jwt__Audience
          key: Jwt__Audience
        - objectName: Jwt__Key
          key: Jwt__Key
        - objectName: Ai__GroqApiKey
          key: Ai__GroqApiKey
        - objectName: Caching__Redis__ConnectionString
          key: Caching__Redis__ConnectionString
        - objectName: Saas__TenantCatalog__Sql__ConnectionString
          key: Saas__TenantCatalog__Sql__ConnectionString
        - objectName: Saas__TenantCatalog__Redis__ConnectionString
          key: Saas__TenantCatalog__Redis__ConnectionString
        - objectName: Saas__Storage__Targets__shared__ConnectionString
          key: Saas__Storage__Targets__shared__ConnectionString
---

{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stms.fullname" . }}-worker
  labels:
    {{- include "stms.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "stms.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "stms.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ include "stms.fullname" . }}-worker
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      nodeSelector:
        workload.stms/type: application
        {{- with .Values.nodeSelector }}{{ toYaml . | nindent 8 }}{{- end }}
      containers:
        - name: worker
          image: {{ include "stms.image" .Values.images.worker | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["run"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: Saas__Resilience__MaxInFlightJobs
              value: {{ .Values.worker.maxInFlightJobs | quote }}
          envFrom:
            - secretRef:
                name: {{ include "stms.fullname" . }}-runtime-secrets
            - configMapRef:
                name: {{ include "stms.fullname" . }}-config
          volumeMounts:
            {{- include "stms.secretMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            failureThreshold: 3
            periodSeconds: 20
      volumes:
        {{- include "stms.runtimeSecretVolume" . | nindent 8 }}
{{- end }}

environment: prod

tenantCatalog:
  cacheKeyPrefix: stms-prod

ingress:
  host: stms.example.com
  tlsSecretName: stms-prod-tls

api:
  replicas: 3
  autoscaling:
    minReplicas: 3
    maxReplicas: 20
  podDisruptionBudget:
    minAvailable: 2
  corsOrigins:
    - https://stms.example.com

frontend:
  replicas: 3
  autoscaling:
    minReplicas: 3
    maxReplicas: 10
  podDisruptionBudget:
    minAvailable: 2

admin:
  migrationEnabled: true

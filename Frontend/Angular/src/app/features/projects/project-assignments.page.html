<section class="page">
  <header class="page-head">
    <div>
      <p class="eyebrow">Project access</p>
      <h1>Assignments</h1>
    </div>
  </header>

  <div class="panel assignment-form">
    <h2>Assign user to project</h2>

    <div class="field-grid">
      <label>
        Project
        <select [(ngModel)]="selectedProjectId" name="selectedProjectId">
          <option [ngValue]="null" disabled>Select project</option>
          <option *ngFor="let project of projects" [ngValue]="project.id">{{ project.name }}</option>
        </select>
      </label>

      <label>
        User
        <select [(ngModel)]="selectedUserId" name="selectedUserId">
          <option [ngValue]="null" disabled>Select user</option>
          <option *ngFor="let user of users" [ngValue]="user.id">{{ user.firstName }} {{ user.lastName }} ({{ user.email }})</option>
        </select>
      </label>

      <label>
        Role
        <select [(ngModel)]="selectedRole" name="selectedRole">
          <option *ngFor="let role of allowedRoles" [value]="role">{{ role }}</option>
        </select>
      </label>
    </div>

    <div class="action-row">
      <button type="button" class="primary" [disabled]="!selectedProjectId || !selectedUserId || isSubmitting" (click)="assignMember()">
        {{ isSubmitting ? 'Assigning...' : 'Assign member' }}
      </button>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <input type="search" [(ngModel)]="search" placeholder="Search assignments" (input)="onSearchInput()" (keyup.enter)="onSearch()" />
      <button type="button" (click)="onSearch()">Search</button>
    </div>

    <div class="filters">
      <label>
        Project
        <select [(ngModel)]="projectFilter" (change)="onFilterChange()">
          <option value="all">All projects</option>
          <option *ngFor="let project of projects" [value]="project.id">{{ project.name }}</option>
        </select>
      </label>

      <label>
        Role
        <select [(ngModel)]="roleFilter" (change)="onFilterChange()">
          <option value="all">All roles</option>
          <option value="Owner">Owner</option>
          <option value="Manager">Manager</option>
          <option value="Member">Member</option>
          <option value="Viewer">Viewer</option>
        </select>
      </label>
    </div>
  </div>

  <div *ngIf="isLoading" class="empty-state">Loading assignments...</div>

  <div *ngIf="!isLoading && assignments.length === 0" class="empty-state">
    No project assignments match the current filters.
  </div>

  <div *ngIf="assignments.length > 0" class="table-wrap">
    <table class="assignment-table">
      <thead>
        <tr>
          <th>Project</th>
          <th>User</th>
          <th>Email</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let assignment of assignments">
          <td>{{ assignment.projectName }}</td>
          <td>{{ assignment.userName }}</td>
          <td>{{ assignment.email }}</td>
          <td>{{ assignment.role }}</td>
          <td class="actions">
            <button type="button" class="danger" (click)="removeAssignment(assignment)">Remove</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pagination" *ngIf="totalPages > 1">
    <button type="button" [disabled]="page === 1" (click)="prevPage()">Previous</button>
    <span>Page {{ page }} of {{ totalPages }}</span>
    <button type="button" [disabled]="page >= totalPages" (click)="nextPage()">Next</button>
  </div>
</section>

<header class="top-nav">
  <nav class="nav-left" aria-label="Main navigation">
    @for (item of menus; track item.id) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="icon">{{ item.icon }}</span>
        <span>{{ item.name }}</span>
      </a>
    }
  </nav>

  <div class="nav-right">
    <button class="icon-btn" aria-label="Notifications" type="button">🔔</button>
    <div class="user-card">
      <img [src]="user?.imageUrl ?? 'https://api.dicebear.com/7.x/initials/svg?seed=User'" alt="User avatar" />
      <div class="user-meta">
        <strong>{{ user?.name ?? 'Guest User' }}</strong>
        <small>{{ user?.role ?? 'Team Member' }}</small>
      </div>
    </div>
    <button class="logout-btn" type="button" (click)="logout()">Logout</button>
  </div>
</header>

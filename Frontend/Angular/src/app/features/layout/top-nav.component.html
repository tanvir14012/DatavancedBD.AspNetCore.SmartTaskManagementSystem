<header class="top-nav">
  <nav class="nav-left" aria-label="Main navigation">
    @for (item of menus; track item.id) {
      <a
        class="nav-item"
        [class.active]="isItemActive(item)"
        [routerLink]="getItemRoute(item)"
      >
        <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
        <span>{{ item.name }}</span>
      </a>
    }
  </nav>

  <div class="nav-right">
    <button class="icon-btn" aria-label="Notifications" type="button">🔔</button>

    <div class="user-menu-wrapper">
      <button class="user-card" type="button" (click)="toggleUserMenu()" aria-label="Open user menu">
        <img [src]="user?.imageUrl ?? 'https://api.dicebear.com/7.x/initials/svg?seed=User'" alt="User avatar" />
        <div class="user-meta">
          <strong>{{ user?.name ?? 'Guest User' }}</strong>
          <small>{{ user?.role ?? 'Team Member' }}</small>
        </div>
      </button>

      @if (userMenuOpen()) {
        <div class="user-menu" role="menu" aria-label="User actions">
          <span class="user-email">{{ user?.email ?? 'guest@example.com' }}</span>
          <button class="logout-btn" type="button" (click)="logout()">Logout</button>
        </div>
      }
    </div>
  </div>
</header>

<section class="page">
  <header class="page-head">
    <div>
      <p class="eyebrow">Directory</p>
      <h1>Users</h1>
    </div>
    <button *ngIf="isAdmin" class="primary" type="button" (click)="openCreateForm()">Invite Member</button>
  </header>

  <div class="toolbar" *ngIf="users.length || isAdmin">
    <div class="search-box">
      <input type="search" [(ngModel)]="search" placeholder="Search users" (keyup.enter)="onSearch()" />
      <button type="button" (click)="onSearch()">Search</button>
    </div>

    <div class="filters">
      <label>
        Role
        <select [(ngModel)]="roleFilter" (change)="onFilterChange()">
          <option value="all">All</option>
          <option value="Admin">Admin</option>
          <option value="Project Manager">Project Manager</option>
          <option value="Team Member">Team Member</option>
        </select>
      </label>

      <label>
        Status
        <select [(ngModel)]="statusFilter" (change)="onFilterChange()">
          <option value="all">All</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </label>

      <label>
        Sort
        <select [(ngModel)]="sortColumn" (change)="onFilterChange()">
          <option value="FirstName">First name</option>
          <option value="LastName">Last name</option>
          <option value="Email">Email</option>
          <option value="CreatedAt">Created</option>
        </select>
      </label>

      <label>
        Direction
        <select [(ngModel)]="sortDirection" (change)="onFilterChange()">
          <option value="asc">Ascending</option>
          <option value="desc">Descending</option>
        </select>
      </label>
    </div>
  </div>

  <div *ngIf="showForm && isAdmin" class="panel">
    <h2>{{ editingUserId === null ? 'Add User' : 'Edit User' }}</h2>
    <form class="user-form" (ngSubmit)="submitForm()">
      <div class="field-grid">
        <label>
          First name
          <input type="text" [(ngModel)]="form.firstName" name="firstName" />
        </label>
        <label>
          Last name
          <input type="text" [(ngModel)]="form.lastName" name="lastName" />
        </label>
      </div>

      <div class="field-grid">
        <label>
          Email
          <input type="email" [(ngModel)]="form.email" name="email" />
        </label>
        <label *ngIf="editingUserId === null">
          Password
          <input type="password" [(ngModel)]="form.password" name="password" />
        </label>
      </div>

      <div class="field-grid single">
        <label>
          Role
          <select [(ngModel)]="form.role" name="role">
            <option value="Admin">Admin</option>
            <option value="Project Manager">Project Manager</option>
            <option value="Team Member">Team Member</option>
          </select>
        </label>
      </div>

      <div class="action-row">
        <button type="button" class="secondary" (click)="showForm = false">Cancel</button>
        <button type="submit" class="primary">{{ editingUserId === null ? 'Create User' : 'Save Changes' }}</button>
      </div>
    </form>
  </div>

  <div *ngIf="users.length === 0" class="empty-state">
    No users match the current filters.
  </div>

  <div *ngIf="users.length > 0" class="table-wrap">
    <table class="user-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th *ngIf="isAdmin">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.firstName }} {{ user.lastName }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.role }}</td>
          <td>
            <span class="status" [class.active]="user.isActive" [class.inactive]="!user.isActive">
              {{ user.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>
          <td *ngIf="isAdmin" class="actions">
            <button type="button" class="secondary" (click)="openEditForm(user)">Edit</button>
            <button type="button" class="danger" (click)="deleteUser(user.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pagination" *ngIf="totalPages > 1">
    <button type="button" [disabled]="page === 1" (click)="prevPage()">Previous</button>
    <span>Page {{ page }} of {{ totalPages }}</span>
    <button type="button" [disabled]="page >= totalPages" (click)="nextPage()">Next</button>
  </div>
</section>
